<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Plant Control Panel</title>
<style>
:root{
  --bg:#f2f3f4; --fg:#16181a; --muted:#5d646b; --line:#d3d7db;
  --card:#ffffff; --accent:#0d7d6b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --fg:#e8eaec; --muted:#9aa3ab; --line:#2a2f34;
    --card:#191c1f; --accent:#38b39c;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --fg:#e8eaec; --muted:#9aa3ab; --line:#2a2f34;
  --card:#191c1f; --accent:#38b39c;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  padding:18px 14px 48px;
}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}

/* ---------- PANEL ---------- */
.panel{
  background:linear-gradient(160deg,#e6e6e2,#cdcdc8);
  border-radius:10px; padding:16px;
  box-shadow:0 6px 22px rgba(0,0,0,.28);
  max-width:520px; margin:0 auto;
}
.window{
  background:#1c1d1f; border-radius:26px; padding:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.face{
  background:linear-gradient(155deg,#dcdedd,#c6c9c8);
  border-radius:16px; padding:18px 14px 22px;
  box-shadow:inset 0 0 22px rgba(0,0,0,.18);
}
.strip{
  background:#f4f4f1; border:1px solid #2b2b2b; color:#141414;
  font-size:9.5px; letter-spacing:.09em; text-align:center;
  padding:2.5px 2px; font-weight:600; border-radius:2px;
  white-space:nowrap; overflow:hidden;
}
.strip.sel3{white-space:normal;overflow:visible;font-size:7.5px;
  letter-spacing:.01em;line-height:1.15;padding:2px 1px}
.block{margin-bottom:22px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;align-items:center}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:58%;margin:0 auto}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:80%;margin:0 auto}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;width:40%;margin:0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:58%;margin:0 auto}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:80%;margin:0 auto}
.htitle{display:grid;grid-template-columns:3fr 2fr;gap:5px;margin-bottom:4px}
.titlebar{margin:0 0 4px}
.titlebar.span{margin-left:16.6%}
.cell{display:flex;justify-content:center;align-items:center;height:52px}

/* lamps + buttons */
.lamp{
  width:38px;height:38px;border-radius:50%;
  border:3px solid #3a3d40; cursor:default; position:relative;
  transition:background .18s, box-shadow .18s;
  background:#4a4f52;
}
.lamp::after{
  content:"";position:absolute;top:5px;left:8px;width:14px;height:8px;
  border-radius:50%;background:rgba(255,255,255,.35);
}
.btn{cursor:pointer;border:3px solid #2f3235}
.btn:active{transform:scale(.94)}

.off-green{background:#20563f}
.on-green{background:#2fe08a;box-shadow:0 0 14px 3px rgba(47,224,138,.65)}
.off-teal{background:#12514c}
.on-teal{background:#12d9c0;box-shadow:0 0 14px 3px rgba(18,217,192,.6)}
.off-red{background:#5c1c1c}
.on-red{background:#ff2f2f;box-shadow:0 0 14px 3px rgba(255,47,47,.6)}
.off-amber{background:#5c3f11}
.on-amber{background:#ffa61f;box-shadow:0 0 14px 3px rgba(255,166,31,.65)}
.off-white{background:#8d918f}
.on-white{background:#f6f7ef;box-shadow:0 0 14px 3px rgba(246,247,239,.7)}

/* rotary selector */
/* MAN-OFF-AUTO selector: black bezel with a flat lever and a white marker */
.knob{
  width:42px;height:42px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#37393c 0%,#191a1c 58%,#0a0b0c 100%);
  border:1px solid #060707; position:relative; cursor:pointer;
  box-shadow:0 3px 7px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.14);
}
.knob i{
  position:absolute;left:50%;top:50%;width:15px;height:40px;
  margin-left:-7.5px;margin-top:-20px;border-radius:4px;
  background:linear-gradient(95deg,#303235 0%,#161719 42%,#0c0d0e 100%);
  box-shadow:0 2px 4px rgba(0,0,0,.55);
  transform-origin:50% 50%;
  transition:transform .18s ease;
}
.knob i::after{
  content:"";position:absolute;left:50%;top:5px;width:5px;height:14px;
  margin-left:-2.5px;border-radius:2px;background:#f4f5f0;
  box-shadow:0 0 1px rgba(0,0,0,.5);
}
.knobwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.knobtag{font-size:8.5px;font-weight:700;color:#1d1f21;letter-spacing:.06em}

/* ---------- TIMER DIAL ---------- */
.tpair{display:flex;gap:14px;align-items:flex-start}
.tdial{flex:0 0 auto;background:linear-gradient(160deg,#d8c7a4,#c9b088);
  padding:8px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.22)}
.tdial svg{display:block}
.dialnote{font-size:11px;color:#3c3222;text-align:center;margin:5px 0 0;line-height:1.35}
.dialnote b{font-variant-numeric:tabular-nums;font-size:13px;color:#1d1810}
.dialkey{display:inline-block;margin-top:4px;font-size:10px;color:#4b3f2c}
.tside{flex:1 1 auto;min-width:0}
@media(max-width:470px){.tpair{gap:9px}}

/* ---------- CONTROLS ---------- */
.controls{max-width:520px;margin:24px auto 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px 14px 16px;margin-bottom:14px;
}
.card h2{font-size:13px;margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row:last-child{margin-bottom:0}
label{font-size:13px}
input[type=time]{
  font-family:inherit;font-size:14px;padding:5px 7px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);
}
input[type=range]{width:100%;accent-color:var(--accent)}
.clock{font-size:30px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{
  font:inherit;font-size:12.5px;padding:6px 12px;border:0;cursor:pointer;
  background:transparent;color:var(--fg);
}
.seg button.sel{background:var(--accent);color:#fff}
.mini{font-size:12px;color:var(--muted);line-height:1.5}
.del{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);
  background:transparent;color:var(--muted);border-radius:6px;cursor:pointer}
.add{font:inherit;font-size:12.5px;padding:6px 11px;border:1px solid var(--accent);
  background:transparent;color:var(--accent);border-radius:7px;cursor:pointer}
.lab{font-size:12.5px;width:96px;color:var(--muted)}
input[type=text],input[type=number],select{font:inherit;font-size:13px;padding:5px 7px;
  border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);max-width:100%}
input[type=text]{flex:1 1 130px;min-width:110px}
input[type=number]{width:70px}
.logrow{border-top:1px solid var(--line);padding:9px 0;font-size:13px;line-height:1.5}
.logrow:first-child{border-top:0}
.logmeta{color:var(--muted);font-size:12px;margin-top:6px}
.rechead{font-weight:600;font-size:13.5px;margin-bottom:5px}
.recline{font-size:13px}
.recrow{display:flex;align-items:baseline;gap:8px;font-size:13.5px;padding:4px 8px;
  border-left:3px solid var(--accent);background:rgba(14,127,108,.07);border-radius:4px;margin-bottom:4px}
.recrow.same{border-left-color:var(--line);background:transparent;padding-left:8px}
.recday{min-width:76px;color:var(--fg);font-size:12px;font-weight:600}
.recrow.same .recday{color:var(--muted);font-weight:400}
.rectime{font-variant-numeric:tabular-nums}
.rectime.old{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.rectime.new{font-weight:700;color:var(--accent)}
.recarrow{color:var(--muted)}
.recnote{color:var(--muted);font-size:12px}
.recrow.same .rectime{color:var(--muted)}
.recwhy{font-size:13px;font-style:italic;color:var(--fg);margin-top:5px}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;
  background:var(--line);margin-right:6px}
.rm{float:right;font:inherit;font-size:11px;padding:2px 7px;border:1px solid var(--line);
  background:transparent;color:var(--muted);border-radius:6px;cursor:pointer}
.setline{font-size:14px;margin-bottom:5px}
.prow{border-left:3px solid var(--line);padding-left:9px;margin-bottom:12px}
.dchips{display:flex;flex-wrap:wrap;gap:4px}
.dchip{font:inherit;font-size:11.5px;padding:4px 8px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted)}
.dchip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.dchip.wide{border-style:dashed;color:var(--accent);border-color:var(--accent);background:transparent}
.photobox{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.loadbox{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.loadbox svg{display:block;max-width:260px}
.signwrap{max-width:300px;border-radius:6px;overflow:hidden;line-height:0}
.signwrap img{width:100%;display:block;transition:filter .3s}
.signwrap.lit img{filter:brightness(1.05) saturate(1.05)}
.signwrap.lit{box-shadow:0 0 18px 4px rgba(90,150,255,.45)}
.signwrap.dark img{filter:brightness(.38) saturate(.35) contrast(.9)}
.loadbox p{margin:4px 0 0}
.logrow{border-top:1px solid var(--line);padding:9px 0;font-size:13px;line-height:1.5}
.logrow:first-child{border-top:0}
.logmeta{color:var(--muted);font-size:12px;margin-top:6px}
.rechead{font-weight:600;font-size:13.5px;margin-bottom:5px}
.recline{font-size:13px}
.recrow{display:flex;align-items:baseline;gap:8px;font-size:13.5px;padding:4px 8px;
  border-left:3px solid var(--accent);background:rgba(14,127,108,.07);border-radius:4px;margin-bottom:4px}
.recrow.same{border-left-color:var(--line);background:transparent;padding-left:8px}
.recday{min-width:76px;color:var(--fg);font-size:12px;font-weight:600}
.recrow.same .recday{color:var(--muted);font-weight:400}
.rectime{font-variant-numeric:tabular-nums}
.rectime.old{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.rectime.new{font-weight:700;color:var(--accent)}
.recarrow{color:var(--muted)}
.recnote{color:var(--muted);font-size:12px}
.recrow.same .rectime{color:var(--muted)}
.recwhy{font-size:13px;font-style:italic;color:var(--fg);margin-top:5px}
label.apply{cursor:pointer}
input[type=text]{font:inherit;font-size:13px;padding:5px 7px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);flex:1 1 150px;min-width:130px}
.lab{font-size:12.5px;width:80px;color:var(--muted)}
.setline b{font-variant-numeric:tabular-nums}
#site{font:inherit;font-size:14px;padding:6px 9px;border-radius:7px;
  border:1px solid var(--line);background:var(--card);color:var(--fg)}
.tl{position:relative;height:16px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 2px}
.tl span{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.8}
.tl b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#e2413c}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.state{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.state b{color:var(--fg)}
.clock small{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.dw{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-left:4px}
.drives{font-size:12.5px;line-height:1.55;margin:0 0 8px}
.tlname{font-size:11.5px;color:var(--muted);margin-top:7px}
.warn{color:#b4611a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .warn{color:#e2a15c}}
:root[data-theme="dark"] .warn{color:#e2a15c}
@media(max-width:420px){
  .lamp{width:32px;height:32px}.knob{width:34px;height:34px}.cell{height:46px}
  .strip{font-size:8px;letter-spacing:.04em}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Check timer</h1>
  <p class="sub">What the timers and panel should look like right now. Compare against the real plant room.</p>
  <div class="row" style="margin-bottom:14px">
    <select id="site"></select>
    <span class="mini" id="siteNote"></span>
  </div>
  <p class="mini" id="ovrNote" style="display:none;margin:-6px 0 14px"></p>
  <p class="mini" id="pendNote" style="display:none;margin:-6px 0 14px"></p>

  <!-- ================= PANEL ================= -->
  <div class="panel" id="panelWrap">
   <div class="window">
    <div class="face">

      <!-- MAIN INCOMING -->
      <div class="block">
        <div class="strip titlebar" id="supplyTitle" style="width:58%;margin:0 auto 4px">MAIN INCOMING LIGHT</div>
        <div class="grid3">
          <div class="strip">L1</div><div class="strip">L2</div><div class="strip">L3</div>
        </div>
        <div class="grid3">
          <div class="cell"><div class="lamp on-white"></div></div>
          <div class="cell"><div class="lamp on-white"></div></div>
          <div class="cell"><div class="lamp on-white"></div></div>
        </div>
      </div>

      <div id="panelPumps"></div>

    </div>
   </div>
  </div>

  <!-- ================= CONTROLS ================= -->
  <div class="controls">

    <div class="card">
      <h2>Clock</h2>
      <div class="row" style="justify-content:space-between">
        <div class="clock"><span id="clockTxt">--:--</span><small id="clockDay"></small></div>
        <div class="seg">
          <button id="mLive" class="sel">Live now</button>
          <button id="mManual">Scrub time</button>
        </div>
      </div>
      <div id="scrubWrap" style="display:none">
        <input type="range" id="scrub" min="0" max="1435" step="5" value="480">
        <div class="ticks"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
        <div class="row" style="margin-top:10px">
          <span class="lab">Day</span><select id="dayPick"></select>
        </div>
      </div>
    </div>

    <div id="timerCards"></div>

    <div class="card">
      <h2>Timer record — this pool</h2>
      <div id="histList"></div>
      <div class="row" style="margin-top:12px"><button class="apply" id="copyHist">Copy for the group</button>
        <span class="mini" id="copyMsg"></span></div>
    </div>

    <div class="card">
      <h2>How it behaves</h2>
      <p class="mini" id="howto"></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
/* ================================================================
   TIMER SETTINGS — the only part that changes when a pool is added.
   Each pool: a name, a list of timers, and whether it has a heat pump.
   A timer needs a label and its ON periods. Add as many as the pool has.

   device: 'hager'   — analogue roller time switch (Hager EH011 and lookalikes)
           'digital' — digital time switch with an LCD
   model:  what is printed on the unit, e.g. 'Hager EH011' or 'Theben TR 610'.
   panel:false — the timer has no row on the main panel.
   ================================================================ */
var SITES = {
  JEIP1: {
    name:'JEIP1',
    heatPumps:1,
    timers:[
      { label:'Circulation Pump 1', device:'hager', model:'Hager EH011',
        sch:[{on:'03:00',off:'15:00'}] },
      { label:'Circulation Pump 2', device:'hager', model:'Hager EH011',
        sch:[{on:'15:00',off:'00:00'}] }
    ]
  },
  /* One time switch runs both circulation pumps: Pump 1 while the contact is
     closed, Pump 2 while it is open, so one of them is always circulating and
     the two never run together. The heat pump has its own time switch and its
     own full row on the door, and different hours at the weekend. */
  JEIP2: {
    name:'JEIP2',
    supply:'SUPPLY ON LIGHTS',
    note:'One timer runs both circulation pumps — duty and standby',
    heatPumps:0,
    timers:[
      { label:'Timer 1 — circulation pumps (duty changeover)', device:'digital', model:'GIC time switch',
        note:'Same programme every day, Monday to Sunday. One pump is always circulating: '+
             'Pump 1 while the contact is closed, Pump 2 while it is open — they never run together.',
        controls:['Circulation Pump 1'], controlsOff:['Circulation Pump 2'],
        sch:[{on:'03:00',off:'06:00'},{on:'18:10',off:'00:00'}] },
      { label:'Timer 2 — heat pump', device:'digital', model:'GIC time switch',
        note:'Different hours at the weekend — check the day on the display, not just the time.',
        controls:['Heat Pump'], needsFlow:true,
        sch:[{on:'09:00',off:'18:00',days:[1,2,3,4,5]},
             {on:'08:00',off:'17:00',days:[0,6]}] }
    ]
  },
  /* Six GIC time switches on the rail (TS1–TS6): one per circulation pump and
     one per heater pump. Pumps 1 and 2 share the same hours, as do 3 and 4, but
     each pump has its own timer, so each is checked and set separately. */
  JEOP2: {
    name:'JEOP2',
    supply:'SUPPLY ON LIGHTS',
    note:'Six digital timers — one per pump',
    heatPumps:0,
    timers:[
      { label:'TS1 — Circulation Pump 1', device:'digital', model:'GIC time switch',
        controls:['Circulation Pump 1'], sch:[{on:'07:00',off:'19:00'}] },
      { label:'TS2 — Circulation Pump 2', device:'digital', model:'GIC time switch',
        controls:['Circulation Pump 2'], sch:[{on:'07:00',off:'19:00'}] },
      { label:'TS3 — Circulation Pump 3', device:'digital', model:'GIC time switch',
        controls:['Circulation Pump 3'], sch:[{on:'19:05',off:'06:55'}] },
      { label:'TS4 — Circulation Pump 4', device:'digital', model:'GIC time switch',
        controls:['Circulation Pump 4'], sch:[{on:'19:05',off:'06:55'}] },
      { label:'TS5 — Heater Pump 1', device:'digital', model:'GIC time switch',
        controls:['Heater Pump 1'], row:'heater', needsFlow:true,
        sch:[{on:'04:00',off:'12:00'}] },
      { label:'TS6 — Heater Pump 2', device:'digital', model:'GIC time switch',
        controls:['Heater Pump 2'], row:'heater', needsFlow:true,
        sch:[{on:'12:00',off:'22:00'}] }
    ]
  },
  /* Tengah has two control panels. Each is listed separately, because a
     technician stands in front of one panel at a time. */
  TENGAH1: {
    name:'Tengah — Panel 1',
    supply:'MAIN INCOMING LIGHTS',
    note:'Panel 1 of 2 — two pumps, one digital timer each',
    heatPumps:0,
    timers:[
      { label:'Timer 1 — Circulation Pump-1', device:'digital', model:'GIC time switch',
        controls:['Circulation Pump-1'], sch:[{on:'03:00',off:'13:00'}] },
      { label:'Timer 2 — Circulation Pump-2', device:'digital', model:'GIC time switch',
        controls:['Circulation Pump-2'], sch:[{on:'13:00',off:'23:30'}] }
    ]
  },
  /* LCP-2, the heat pump panel: one circulation pump and one heater pump,
     each on its own digital timer, with different hours at the weekend. */
  TENGAH2: {
    name:'Tengah — Panel 2 (heat pump)',
    supply:'MAIN INCOMING LIGHTS',
    note:'Panel 2 of 2 — weekday and weekend hours differ',
    heatPumps:0,
    timers:[
      { label:'Timer 1 — Circulation Pump', device:'digital', model:'GIC time switch',
        note:'Different hours at the weekend — check the day on the display, not just the time.',
        controls:['Circulation Pump'],
        sch:[{on:'09:00',off:'19:00',days:[1,2,3,4,5]},
             {on:'06:00',off:'18:00',days:[0,6]}] },
      { label:'Timer 2 — Heater Pump', device:'digital', model:'GIC time switch',
        note:'Different hours at the weekend. Heating only runs while the circulation pump is running.',
        controls:['Heater Pump'], row:'heater', needsFlow:true,
        sch:[{on:'12:00',off:'18:00',days:[1,2,3,4,5]},
             {on:'07:00',off:'16:00',days:[0,6]}] }
    ]
  },
  /* Six circulation pumps, each on its own Hager roller timer. Pumps 2 and 5 are
     Pumps 2, 5 and 6 are kept off at the selector and have no timer set. The heat pumps have no
     timer at all — they follow their OFF-ON switch and the circulation. */
  HS: {
    name:'HS',
    supply:'INCOMING SUPPLY LIGHT',
    note:'Six pumps · pumps 1, 3 and 4 on timers · pumps 2, 5 and 6 kept off',
    heatPumps:2,
    heatStyle:'runstop',
    timers:[
      { label:'Timer 1 — Circulation Pump 1', device:'hager', model:'Hager EH011',
        controls:['Circulation Pump 1'], sch:[{on:'07:00',off:'21:00'}] },
      { label:'Circulation Pump 2 — no timer', noTimer:true, startSel:'OFF',
        note:'Kept permanently off at the selector. No timer set. '+
             'The door label still reads 10PM–6AM from when it was in use.',
        controls:['Circulation Pump 2'], sch:[] },
      { label:'Timer 3 — Circulation Pump 3', device:'hager', model:'Hager EH011',
        controls:['Circulation Pump 3'], sch:[{on:'22:00',off:'06:00'}] },

var S = { mode:'live', manual:480, day:new Date().getDay(), site:'JEIP1',
          timers:[], pumps:[], heat:[], heatCount:0,
          selLabel:'MAN-OFF-AUTO', tripLabel:'TRIP' };

function loadSite(id){
  if(!SITES[id]) return;
  S.site=id;
  var cfg=SITES[id];
  S.heatCount = (cfg.heatPumps!==undefined) ? cfg.heatPumps : (cfg.heatPump?1:0);
  S.selLabel  = cfg.selector  || 'MAN-OFF-AUTO';
  S.btnStart  = cfg.startLabel || 'START';
  S.btnStop   = cfg.stopLabel  || 'STOP';
  S.tripLabel = cfg.tripLabel || 'TRIP';

  var ovr=readOvr()[id];
  S.timers = cfg.timers.map(function(t,ti){
    var sch = (ovr && ovr[ti]) ? ovr[ti] : t.sch;
    return {label:t.label, device:(t.device||'hager'), model:(t.model||''),
            controls:(t.controls||null), controlsOff:(t.controlsOff||null), note:(t.note||''),
            row:(t.row||''), extra:(t.extra||''), noTimer:!!t.noTimer, startSel:(t.startSel||''),
            load:(t.load||''), hz:(t.hz||''),
            needsFlow:!!t.needsFlow, tsw:'auto',
            /* days come from the pool's saved settings; an edit on the phone
               changes the times only, so they are carried across */
            sch:sch.map(function(w,j){
              var src=t.sch[j];
              return {on:w.on, off:w.off, days:(w.days||(src&&src.days)||null)};
            })};
  });

  S.heatStyle = cfg.heatStyle || 'on';
  var pw=document.getElementById('panelWrap');
  if(pw) pw.style.display = cfg.noPanel ? 'none' : '';
  S.pumps=[];
  S.timers.forEach(function(t,ti){
    if(t.controls===null && t.panelOff) return;
    var names = t.controls || [t.label];
    names.forEach(function(nm){
      S.pumps.push({label:nm, t:ti, row:(t.row||''), extra:(t.extra||''), invert:false, needsFlow:t.needsFlow,
                    flow:!t.needsFlow, noTimer:!!t.noTimer,
                    sel:(t.startSel||'AUTO'), tripped:false, manRun:(t.startSel!=='OFF')});
    });
    (t.controlsOff||[]).forEach(function(nm){
      S.pumps.push({label:nm, t:ti, row:(t.row||''), invert:true, needsFlow:false,
                    flow:true, sel:'AUTO', tripped:false, manRun:true});
    });
  });

  S.heat=[]; for(var k=0;k<S.heatCount;k++) S.heat.push('ON');

  try{ localStorage.setItem('timerSite', id); }catch(e){}
  cloudWatch(id);
  var sup=document.getElementById('supplyTitle');
  if(sup) sup.textContent = cfg.supply || 'MAIN INCOMING LIGHT';
  var nt=document.getElementById('siteNote');
  if(nt) nt.textContent = cfg.note || 'Timer settings for this pool';
  buildPanel(); buildCards(); drawOvrNote(); drawHistory(); buildHowTo();
}

function drawVsd(i, running, hz){
  document.getElementById('vhz'+i).textContent = hz;        /* set point, shown either way */
  document.getElementById('vrun'+i).setAttribute('fill', running ? '#28d17c' : '#1c5f3a');
  document.getElementById('vled'+i).setAttribute('fill', running ? '#ff3b30' : '#5c2320');
  document.getElementById('vcap'+i).textContent = running
    ? 'Fan running at '+hz+' Hz'
    : 'Fan stopped — display still reads '+hz+' Hz';
  var f=document.getElementById('vfan'+i);
  if(f) f.setAttribute('opacity', running ? '1' : '0.55');
}

/* SUL 181 d: hours read anti-clockwise from the pointer on the right.
   Case legend: rider pushed OUT = 0 (off), pushed IN = 1 (on). */
function drawTheben(i,m){
  var t=S.timers[i], CX=106, CY=142, g='';
  function pt(mins, r){                       /* now sits at the top mark */
    var a=(-90 - ((mins-m)/1440)*360) * Math.PI/180;
    return [CX+r*Math.cos(a), CY+r*Math.sin(a)];
  }
  function polar(deg, r){
    var a=(deg-90)*Math.PI/180;
    return [CX+r*Math.cos(a), CY+r*Math.sin(a)];
  }
  for(var k=0;k<96;k++){
    var on=timerOn(t, k*15+7);
    var r1= on?46:56, r2= on?55:65;
    var a=pt(k*15, r1), b=pt(k*15, r2);
    g+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+
       '" y2="'+b[1].toFixed(1)+'" stroke="'+(on?'#2a4fa8':'#b9c4d6')+
       '" stroke-width="'+(on?'3':'2.4')+'" stroke-linecap="round"/>';
  }
  for(var h=2;h<=24;h+=2){
    var q=pt(h*60, 37);
    g+='<text x="'+q[0].toFixed(1)+'" y="'+(q[1]+3).toFixed(1)+'" text-anchor="middle" '+
       'font-family="Arial" font-size="8" fill="#3b3e3b">'+h+'</text>';
  }
  document.getElementById('rdial'+i).innerHTML=g;

  /* hour marks on the inner 12-hour face */
  var marks='';
  for(var q=0;q<12;q++){
    var a1=polar(q*30, 30), a2=polar(q*30, 38);
    marks+='<line x1="'+a1[0].toFixed(1)+'" y1="'+a1[1].toFixed(1)+'" x2="'+a2[0].toFixed(1)+
           '" y2="'+a2[1].toFixed(1)+'" stroke="#6a6d6a" stroke-width="'+(q%3===0?2.4:1.4)+'"/>';
  }
  document.getElementById('rmark'+i).innerHTML=marks;

  /* long minute hand, short hour hand with a triangular tip */
  var mins=((Math.round(m)%1440)+1440)%1440, hh=mins/60, mm=mins%60;
  var mDeg=(mm/60)*360, hDeg=((hh%12)/12)*360;
  var mTip=polar(mDeg, 40);
  var hTip=polar(hDeg, 25), hL=polar(hDeg-7, 17), hR=polar(hDeg+7, 17);
  document.getElementById('rhand'+i).innerHTML=
    '<line x1="'+CX+'" y1="'+CY+'" x2="'+mTip[0].toFixed(1)+'" y2="'+mTip[1].toFixed(1)+
      '" stroke="#3b3e3b" stroke-width="3" stroke-linecap="round"/>'+
    '<path d="M'+hL[0].toFixed(1)+' '+hL[1].toFixed(1)+' L'+hTip[0].toFixed(1)+' '+hTip[1].toFixed(1)+
      ' L'+hR[0].toFixed(1)+' '+hR[1].toFixed(1)+' Z" fill="#3b3e3b"/>';

  /* the three windows read 3/6/9 before noon and 15/18/21 after it */
  var pm = mins>=720;
  document.getElementById('w3'+i).textContent = pm?'15':'3';
  document.getElementById('w6'+i).textContent = pm?'18':'6';
  document.getElementById('w9'+i).textContent = pm?'21':'9';

  document.getElementById('rmdl'+i).textContent=t.model||'';
  document.getElementById('ts'+i).setAttribute('transform',
    t.tsw==='on' ? 'translate(-28,0)' : 'translate(0,0)');
}

/* The disc turns clockwise past a fixed pointer at the top, so a time still to
   come sits anti-clockwise of it — which is why the hours read anti-clockwise.
   A segment pushed OUT towards the rim switches on; pushed IN towards the
   centre it is off, so the two sit at different radii, not just colours. */
function drawRound(i,m){
  var t=S.timers[i], CX=82, CY=82, g='';
  function pt(mins, r){
    var a=(-90 - ((mins-m)/1440)*360) * Math.PI/180;
    return [CX+r*Math.cos(a), CY+r*Math.sin(a)];
  }
  for(var k=0;k<96;k++){
    var on=timerOn(t, k*15+7);
    var r1= on?57:45, r2= on?69:56;
    var a=pt(k*15, r1), b=pt(k*15, r2);
    g+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+
       '" y2="'+b[1].toFixed(1)+'" stroke="'+(on?'#2f74ad':'#b9bfb9')+
       '" stroke-width="'+(on?'3':'2.4')+'" stroke-linecap="round"/>';
  }
  for(var h=1;h<=24;h++){
    var q=pt(h*60, 34);
    g+='<text x="'+q[0].toFixed(1)+'" y="'+(q[1]+3).toFixed(1)+'" text-anchor="middle" '+
       'font-family="Arial" font-size="7.5" fill="#3b3e3b">'+h+'</text>';
  }
  document.getElementById('rdial'+i).innerHTML=g;
  document.getElementById('rmdl'+i).textContent=t.model||'';
  document.getElementById('ts'+i).setAttribute('transform',
    t.tsw==='on' ? 'translate(22,0)' : 'translate(0,0)');
}

function drawDigital(i,m,today){
  var t=S.timers[i];
  if(today===undefined) today=nowDay();
  document.getElementById('lcd'+i).textContent=fmt(m);
  document.getElementById('mdl'+i).textContent=t.model||'Digital time switch';
  var h='';
  for(var k=0;k<7;k++){
    var d=(k+1)%7, x=22+k*13;            /* the unit prints MO…SU */
    h+='<text x="'+x+'" y="56" text-anchor="middle" opacity="'+(d===today?1:0.35)+'" '+
       'font-weight="'+(d===today?'bold':'normal')+'">'+DAYSH[d]+'</text>';
    if(d===today) h+='<rect x="'+(x-7)+'" y="60" width="14" height="2" fill="#1f2a1c"/>';
  }
  document.getElementById('days'+i).innerHTML=h;
  var on=contact(t,m,today);
  document.getElementById('lcdout'+i).setAttribute('fill', on?'#1f2a1c':'#7d8a78');
  document.getElementById('lcdmode'+i).textContent = t.tsw==='on' ? 'MAN' : 'AUTO';
  document.getElementById('ts'+i).setAttribute('transform',
    t.tsw==='on' ? 'translate(-32,0)' : 'translate(0,0)');
}

function shrinkAndStamp(file, caption, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height, max=1280;
      if(w>max||h>max){ var k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); }
      var c=document.createElement('canvas'); c.width=w; c.height=h+34;
      var x=c.getContext('2d');
      x.fillStyle='#111'; x.fillRect(0,0,c.width,c.height);
      x.drawImage(img,0,0,w,h);
      x.fillStyle='#fff'; x.font='bold 16px Arial'; x.textBaseline='middle';
      x.fillText(caption, 10, h+17);
      cb(c.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}

function toMin(t){ var p=t.split(':'); return (+p[0])*60 + (+p[1]); }
function pad(n){ return (n<10?'0':'')+n; }
function fmt(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); }
function nowMin(){
  if(S.mode==='manual') return S.manual;
  var d=new Date(); return d.getHours()*60+d.getMinutes();
}
function nowDay(){ return S.mode==='manual' ? S.day : new Date().getDay(); }
/* A period can be limited to certain days. When it crosses midnight the days
   listed are the days it STARTS on, so the tail after midnight belongs to the
   day before — the way the time switch itself counts it. */
function inWindow(w, m, d){
  var a=toMin(w.on), b=toMin(w.off), days=w.days||null;
  if(a===b) return false;
  function ok(x){ return !days || days.indexOf(x)>=0; }
  if(d===undefined) d=nowDay();
  if(a<b) return (m>=a && m<b) && ok(d);
  if(m>=a) return ok(d);
  if(m<b)  return ok((d+6)%7);
  return false;
}
function timerOn(p, m, d){ for(var i=0;i<p.sch.length;i++){ if(inWindow(p.sch[i],m,d)) return true; } return false; }
function contact(t, m, d){
  if(t.tsw==='on') return true;
  return timerOn(t, m, d);
}
/* what the timer asks of this row, before the selector and the flow rule */
function demand(p, m, d){
  var on=contact(S.timers[p.t], m, d);
  return p.invert ? !on : on;
}
function running(p, m, d){
  if(p.tripped) return false;
  if(p.sel==='OFF') return false;
  if(p.sel==='MAN') return p.manRun;
  return demand(p, m, d);
}
/* Circulation first, then anything that cannot run without flow. */
function runState(m, d){
  var out=S.pumps.map(function(p){ return running(p,m,d); });
  var flow=S.pumps.some(function(p,i){ return p.flow && out[i]; });
  S.pumps.forEach(function(p,i){ if(p.needsFlow && !flow) out[i]=false; });
  return {run:out, flow:flow};
}
var DAYSH=['SU','MO','TU','WE','TH','FR','SA'];
var DAYFULL=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dayWord(list){
  if(!list) return '';
  var s=list.slice().sort().join();
  if(list.length===7) return 'every day';
  if(s===[1,2,3,4,5].join()) return 'Mon–Fri';
  if(s===[0,6].join()) return 'Sat–Sun';
  return list.slice().sort().map(function(d){ return DAYSH[d]; }).join(' ');
}

function parseSchText(txt){
  var out=[], re=/(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})\s*(?:\(([^)]+)\))?/g, m;
  while((m=re.exec(txt))!==null)
    out.push({time:m[1]+'–'+m[2], days:(m[3]||'Every day')});
  return out;
}
function schList(sch){
  return sch.map(function(w){
    return {time:w.on+'–'+w.off, days:(w.days?dayWord(w.days):'Every day')};

}

  return sch.length ? sch.map(function(w){
    return w.on+'–'+w.off+' ('+(w.days?dayWord(w.days):'Mon–Sun')+')';

    var bars='', x=0;
    while(x<1440){
      var on = p.invert ? !timerOn(t,x,d) : timerOn(t,x,d);
      if(!on){ x++; continue; }
      var st=x;
      while(x<1440 && (p.invert ? !timerOn(t,x,d) : timerOn(t,x,d))) x++;
      bars+='<span style="left:'+(st/1440*100)+'%;width:'+((x-st)/1440*100)+'%"></span>';
    }
    if(mine.length>1 && p.label) h+='<div class="tlname">'+p.label+(p.invert?' <span class="dw">(runs while the contact is off)</span>':'')+'</div>';
    h+='<div class="tl">'+bars+'<b style="left:'+(m/1440*100)+'%"></b></div>';
  });
  el.innerHTML=h;
}

function setLamp(id, cls){ var e=document.getElementById(id); e.className='lamp '+cls; }

/* --- Hager EH011 dial: scale ring seen through the window --- */
function drawDial(i, m, day){
  var p=S.timers[i], R=175, CY=196, g='', k, a, b;
  if(day===undefined) day=nowDay();
  function proj(t){
    var d=((t-m+720+2880)%1440)-720, th=d/1440*2*Math.PI;
    return {y:CY+R*Math.sin(th), c:Math.cos(th), bow:(1-Math.cos(th))*7,
            vis:Math.abs(d)<350};
  }
  /* the tappet drum, seen edge-on */
  g+='<rect x="86" y="26" width="28" height="196" fill="#8f938e"/>';
  for(k=0;k<96;k++){                                   /* tappets: pushed left = ON */
    a=proj(k*15); b=proj(k*15+15);
    if(!a.vis&&!b.vis) continue;
    var y1=Math.min(a.y,b.y), h=Math.abs(b.y-a.y);
    if(h<0.5) continue;
    var on=timerOn(p, k*15+7, day), c=(a.c+b.c)/2, bw=(a.bow+b.bow)/2;
    var x = (on?87:101) + bw*0.35;
    g+='<rect x="'+x.toFixed(1)+'" y="'+(y1+0.35).toFixed(1)+'" width="12" height="'+
       Math.max(h-0.7,0.6).toFixed(1)+'" rx=".8" fill="'+(on?'#33618a':'#41454a')+
       '" stroke="'+(on?'#23486a':'#2b2f33')+'" stroke-width=".5" opacity="'+
       (0.5+0.5*c).toFixed(2)+'"/>';
  }
  for(k=0;k<96;k++){                                   /* 15-min ticks, bowed like the ring */
    var q=proj(k*15); if(!q.vis) continue;
    var hr=(k%4===0), len=hr?12:7, x0=83-len-q.bow;
    g+='<rect x="'+x0.toFixed(1)+'" y="'+(q.y-0.4).toFixed(1)+'" width="'+len+'" height="'+(hr?1.3:0.9)+
       '" fill="#3c3f42" opacity="'+(0.3+0.7*q.c).toFixed(2)+'"/>';
  }
  for(k=0;k<24;k++){                                   /* hour numbers, squashed by the curve */
    var n=proj(k*60); if(!n.vis || n.c<0.1) continue;
    g+='<g transform="translate('+(70-n.bow).toFixed(1)+','+n.y.toFixed(1)+') scale(1,'+
       n.c.toFixed(3)+')"><text x="0" y="4.4" text-anchor="end" font-family="Arial" '+
       'font-weight="bold" font-size="13" fill="#24272a" opacity="'+
       (0.4+0.6*n.c).toFixed(2)+'">'+k+'</text></g>';
  }
  document.getElementById('dial'+i).innerHTML=g;
  document.getElementById('dn'+i).textContent=fmt(m);
  document.getElementById('ts'+i).setAttribute('transform',
    p.tsw==='on' ? 'translate(0,26)' : 'translate(0,0)');
}

function render(){
  var m=nowMin(), d=nowDay(), r=runState(m,d);
  document.getElementById('clockTxt').textContent=fmt(m);
  var cd=document.getElementById('clockDay'); if(cd) cd.textContent=DAYS[d];

  S.pumps.forEach(function(p,i){
    var run=r.run[i];
    if(p.row==='heater'){
      setLamp('run'+i, run?'on-white':'off-white');
      setLamp('stp'+i, run?'off-red':'on-red');
    } else if(p.row==='simple'){
      setLamp('run'+i, run?'on-green':'off-green');
      setLamp('stp'+i, run?'off-red':'on-red');
    } else {
      setLamp('run'+i, run?'on-teal':'off-teal');
      setLamp('stp'+i, run?'off-red':'on-red');
      setLamp('trp'+i, p.tripped?'on-amber':'off-amber');
    }
    document.getElementById('k'+i+'tag').textContent=p.sel;
    document.querySelector('[data-knob="'+i+'"] i').style.transform='rotate('+ANG[p.sel]+'deg)';
  });

  S.timers.forEach(function(t,i){
    drawTimeline(i,m,d);
    if(t.device==='digital') drawDigital(i,m,d);
    else if(t.device==='theben') drawTheben(i,m);
    else if(t.device==='round') drawRound(i,m);
    else drawDial(i,m,d);
    document.getElementById('dn'+i).textContent=fmt(m)+(t.device==='digital'?' · '+DAYSH[d]:'');

    /* what this timer is doing to its rows right now */
    var mine=S.pumps.map(function(p,pi){ return {p:p,i:pi}; }).filter(function(x){ return x.p.t===i; });
    var dr=document.getElementById('dr'+i);
    if(dr) dr.innerHTML = mine.map(function(x){
      return '<div>'+x.p.label+' — <b>'+(r.run[x.i]?'running':'stopped')+'</b>'+
             (x.p.invert?' <span class="dw">standby</span>':'')+'</div>';
    }).join('');

    var closed=contact(t,m,d), st;
    if(t.tsw==='on'){
      st='Held <b>ON</b> by hand — the programme is ignored until it is put back to auto.';
    } else {
      st = closed ? 'In timer period — <b>contact closed</b>.' : 'Outside timer period — <b>contact open</b>.';
      var nx=nextChange(t,m,d);
      if(nx) st+=' Next change at <b>'+fmt(nx.m)+'</b>'+(nx.sameDay?'':' ('+DAYS[nx.d]+')')+'.';
      st+=' Closed <b>'+dailyHours(t,d)+' h</b> today.';
    }
    var odd=mine.filter(function(x){ return x.p.tripped || x.p.sel!=='AUTO'; });
    if(odd.length) st+='<br><span class="warn">'+odd.map(function(x){
      return x.p.label+(x.p.tripped?' is tripped':' selector is at '+x.p.sel);
    }).join('; ')+' — the timer cannot reach it.</span>';
    if(!r.flow && mine.some(function(x){ return x.p.needsFlow; }))
      st+='<br><span class="warn">No circulation pump is running, so this stays off whatever the timer says.</span>';
    document.getElementById('st'+i).innerHTML=st;
    if(t.load==='banner') drawBanner(i, closed);
    if(t.load==='vsd') drawVsd(i, closed, t.hz||'30.0');
  });

  S.pumps.forEach(function(p,i){
    if(!p.extra) return;
    var circ = S.pumps.some(function(q,qi){
      return q.row!=='simple' && q.row!=='heater' && running(q, m); });
    setLamp('xlamp'+i, circ?'on-teal':'off-teal');
  });

  for(var k=0;k<S.heatCount;k++){
    var hpOn = (S.heat[k]==='ON' && r.flow);
    setLamp('hplamp'+k, hpOn?(S.heatStyle==='runstop'?'on-teal':'on-green')
                            :(S.heatStyle==='runstop'?'off-teal':'off-green'));
    if(S.heatStyle==='runstop') setLamp('hpstop'+k, hpOn?'off-red':'on-red');
    document.getElementById('kh'+k+'tag').textContent=S.heat[k];
    document.querySelector('[data-knob="heat'+k+'"] i').style.transform='rotate('+ANG[S.heat[k]]+'deg)';
  }
}

function nextChange(p,m,d){
  var cur=timerOn(p,m,d);
  for(var k=1;k<=1440*7;k++){
    var tot=m+k, mm=tot%1440, dd=(d+Math.floor(tot/1440))%7;
    if(timerOn(p,mm,dd)!==cur) return {m:mm, d:dd, sameDay:Math.floor(tot/1440)===0};
  }
  return null;
}
function dailyHours(p,d){
  var mins=0;
  for(var t=0;t<1440;t++) if(timerOn(p,t,d)) mins++;
  return (mins/60).toFixed(1);
}

function buildHowTo(){
  var el=document.getElementById('howto'); if(!el) return;
  var swap=S.pumps.some(function(p){ return p.invert; });
  var anyDigital=S.timers.some(function(t){ return t.device==='digital'; });
  var h='<b>AUTO</b> — the pump follows its timer periods. <b>MAN</b> — runs continuously, '+
        'START/STOP take over. <b>OFF</b> — dead, STOP lamp lit.<br>'+
        'RUN lamp lit while running, red STOP lamp lit while stopped. A heat pump only runs when '+
        'at least one circulation pump is running (no flow, no heating).<br>'+
        'Tap a <b>TRIP</b> lamp to simulate an overload trip — the pump drops out until you tap it again to reset.';
  if(swap) h+='<br><br><b>One timer, two pumps.</b> The changeover timer runs the duty pump while its '+
      'contact is closed and the standby pump while it is open, so one pump is always circulating and '+
      'the two never run together. A pump stopped at the right time is normal here — check the '+
      '<i>other</i> one is running before calling it a fault.';
  h+='<br><br><b>The unit beside each timer</b> is what the real one in the plant room should look like now. '+
     'Hold your phone next to it and compare'+
     (anyDigital ? ' — the time <i>and</i> the day. Then press the programme button and step through: '+
                   'each step should read exactly what is listed here.'
                 : ': the hour against the ▶ pointer should match, and the blue tappets should be pushed '+
                   'in over the same hours.')+
     ' If the real one is out, the pool is running to the wrong clock — correct it and note it down below.';
  el.innerHTML=h;
}

/* ---- events ---- */
document.addEventListener('click', function(e){
  var ts=e.target.closest('[data-tsw]');
  if(ts){ var ti=+ts.dataset.tsw;
    S.timers[ti].tsw = (S.timers[ti].tsw==='on') ? 'auto' : 'on';
    save(); render(); return; }
  var k=e.target.closest('[data-knob]');
  if(k){
    if(k.dataset.knob.indexOf('heat')===0){
      var hk=+k.dataset.knob.slice(4);
      S.heat[hk] = S.heat[hk]==='ON'?'OFF':'ON';
    } else {
      var order=['MAN','OFF','AUTO'], p=S.pumps[+k.dataset.knob];
      p.sel=order[(order.indexOf(p.sel)+1)%3];
    }
    save(); render(); return;
  }
  var ed=e.target.closest('[data-edit]');
  if(ed){ var ei=+ed.dataset.edit;
    EDIT[ei]=true; BEFORE[ei]=fmtSch(S.timers[ei].sch);
    BEFORE['raw'+ei]=S.timers[ei].sch.map(function(w){
      return {on:w.on, off:w.off, days:(w.days?w.days.slice():null)}; });
    drawSchedules(ei); return; }

  var ce=e.target.closest('[data-canceledit]');
  if(ce){ var ci=+ce.dataset.canceledit;
    S.timers[ci].sch=BEFORE['raw'+ci].map(function(w){
      return {on:w.on, off:w.off, days:(w.days?w.days.slice():null)}; });
    EDIT[ci]=false; drawSchedules(ci); render(); return; }

  var dy=e.target.closest('[data-day]');
  if(dy){
    var q=dy.dataset.day.split('-'), ti=+q[0], pj=+q[1], w=S.timers[ti].sch[pj];
    if(q[2]==='all'){ w.days=null; }
    else{
      var d=+q[2];
      var cur = w.days ? w.days.slice() : [0,1,2,3,4,5,6];
      var at=cur.indexOf(d);
      if(at>=0){ if(cur.length===1) return; cur.splice(at,1); }
      else cur.push(d);
      cur.sort();
      w.days = (cur.length===7) ? null : cur;
    }
    drawSchedules(ti); render(); return;
  }

  var se=e.target.closest('[data-savedit]');
  if(se){ var si=+se.dataset.savedit;
    var who=(document.getElementById('who'+si).value||'').trim();
    var why=(document.getElementById('why'+si).value||'').trim();
    var err=document.getElementById('err'+si);
    if(!who){ err.textContent='Put your name in.'; return; }
    if(!why){ err.textContent='Say why it was changed.'; return; }
    var after=fmtSch(S.timers[si].sch);
    if(after===BEFORE[si]){ EDIT[si]=false; drawSchedules(si); render(); return; }
    WHO=who; try{ localStorage.setItem('timerWho', who); }catch(e2){}
    saveOvr();
    addRecord({kind:'change', timer:S.timers[si].label, before:BEFORE[si], after:after,
               beforeList:schList(BEFORE['raw'+si]), afterList:schList(S.timers[si].sch),
               who:who, reason:why});
    EDIT[si]=false; drawSchedules(si); render(); return; }

  var d=e.target.closest('[data-del]');
  if(d){
    var dp=d.dataset.del.split('-');
    S.timers[+dp[0]].sch.splice(+dp[1],1);
    drawSchedules(+dp[0]); render(); return;
  }
  var ad=e.target.closest('[data-add]');
  if(ad){
    var ai=+ad.dataset.add;
    S.timers[ai].sch.push({on:'00:00',off:'06:00',days:null});
    drawSchedules(ai); render(); return;
  }
  var b=e.target.closest('[data-press]');
  if(b){
    var a=b.dataset.press;
    if(a.indexOf('start')===0){ var i=+a.slice(5); S.pumps[i].manRun=true; }
    if(a.indexOf('stop')===0){ var i2=+a.slice(4); S.pumps[i2].manRun=false; }
    if(a.indexOf('trip')===0){ var i3=+a.slice(4); S.pumps[i3].tripped=!S.pumps[i3].tripped; }
    save(); render(); return;
  }
});

document.addEventListener('change', function(e){
  var t=e.target;
  if(t.dataset && t.dataset.photo!==undefined && t.files && t.files[0]){
    sendPhoto(+t.dataset.photo, t.files[0]); t.value=''; return;
  }
  if(t.dataset && t.dataset.p!==undefined && t.type==='time'){
    S.timers[+t.dataset.p].sch[+t.dataset.j][t.dataset.f]=t.value||'00:00';
    render();
  }
});

document.getElementById('mLive').onclick=function(){
  S.mode='live'; this.classList.add('sel');
  document.getElementById('mManual').classList.remove('sel');
  document.getElementById('scrubWrap').style.display='none'; render();
};
document.getElementById('mManual').onclick=function(){
  S.mode='manual'; this.classList.add('sel');
  document.getElementById('mLive').classList.remove('sel');
  document.getElementById('scrubWrap').style.display='block';
  document.getElementById('scrub').value=S.manual;
  document.getElementById('dayPick').value=String(S.day);
  render();
};
document.getElementById('scrub').oninput=function(){ S.manual=+this.value; render(); };
(function(){
  var dp=document.getElementById('dayPick'), h='';
  for(var i=1;i<=7;i++){ var d=i%7; h+='<option value="'+d+'">'+DAYS[d]+'</option>'; }
  dp.innerHTML=h; dp.value=String(S.day);
  dp.onchange=function(){ S.day=+this.value; render(); };
})();

cloudInit();
var last=null; try{ last=localStorage.getItem('timerSite'); }catch(e){}
loadSite(SITES[last]?last:'JEIP1');

(function(){
  var sel=document.getElementById('site'), h='';
  var keys=ORDER.filter(function(k){ return SITES[k]; })
    .concat(Object.keys(SITES).filter(function(k){ return ORDER.indexOf(k)<0; }));
  keys.forEach(function(k){
    h+='<option value="'+k+'"'+(k===S.site?' selected':'')+'>'+SITES[k].name+'</option>';
  });
  PENDING.forEach(function(n){
    h+='<option value="pending:'+n+'">'+n+' — not set up yet</option>';
  });
  sel.innerHTML=h;
  sel.onchange=function(){
    if(this.value.indexOf('pending:')===0){
      var nm=this.value.slice(8), pn=document.getElementById('pendNote');
      pn.innerHTML='<b>'+nm+'</b> has not been set up yet — its timer settings still need to be added.';
      pn.style.display='';
      this.value=S.site;
      return;
    }
    document.getElementById('pendNote').style.display='none';
    loadSite(this.value); render();
  };
  document.getElementById('siteNote').textContent='Timer settings for this pool';
  document.getElementById('copyHist').onclick=function(){
    var rows=LOG.filter(function(r){ return r.site===S.site; });
    if(!rows.length) return;
    var txt='Timer record — '+SITES[S.site].name+'\n'+rows.map(function(r){
      return stamp(r.at)+' · '+(r.kind==='photo'?'Photo · '+r.timer+(r.link?' · '+r.link:'')
        : r.timer+' '+r.before+' → '+r.after)+(r.reason?' · '+r.reason:'')+' · '+(r.who||'—');
    }).join('\n');
    var m=document.getElementById('copyMsg');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ m.textContent='Copied.'; });
    } else { m.textContent='Long-press to select instead.'; }
    setTimeout(function(){ m.textContent=''; }, 4000);
  };
})();

render();
setInterval(function(){ if(S.mode==='live') render(); }, 5000);


</script>
