<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pool Plant Control Panel</title>
<style>
:root{
  --bg:#f2f3f4; --fg:#16181a; --muted:#5d646b; --line:#d3d7db;
  --card:#ffffff; --accent:#0d7d6b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --fg:#e8eaec; --muted:#9aa3ab; --line:#2a2f34;
    --card:#191c1f; --accent:#38b39c;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --fg:#e8eaec; --muted:#9aa3ab; --line:#2a2f34;
  --card:#191c1f; --accent:#38b39c;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  padding:18px 14px 48px;
}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}

/* ---------- PANEL ---------- */
.panel{
  background:linear-gradient(160deg,#e6e6e2,#cdcdc8);
  border-radius:10px; padding:16px;
  box-shadow:0 6px 22px rgba(0,0,0,.28);
  max-width:520px; margin:0 auto;
}
.window{
  background:#1c1d1f; border-radius:26px; padding:13px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.face{
  background:linear-gradient(155deg,#dcdedd,#c6c9c8);
  border-radius:16px; padding:18px 14px 22px;
  box-shadow:inset 0 0 22px rgba(0,0,0,.18);
}
.strip{
  background:#f4f4f1; border:1px solid #2b2b2b; color:#141414;
  font-size:9.5px; letter-spacing:.09em; text-align:center;
  padding:2.5px 2px; font-weight:600; border-radius:2px;
  white-space:nowrap; overflow:hidden;
}
.strip.sel3{white-space:normal;overflow:visible;font-size:7.5px;
  letter-spacing:.01em;line-height:1.15;padding:2px 1px}
.block{margin-bottom:22px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;align-items:center}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:58%;margin:0 auto}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:80%;margin:0 auto}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;width:40%;margin:0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:58%;margin:0 auto}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:80%;margin:0 auto}
.htitle{display:grid;grid-template-columns:3fr 2fr;gap:5px;margin-bottom:4px}
.titlebar{margin:0 0 4px}
.titlebar.span{margin-left:16.6%}
.cell{display:flex;justify-content:center;align-items:center;height:52px}

/* lamps + buttons */
.lamp{
  width:38px;height:38px;border-radius:50%;
  border:3px solid #3a3d40; cursor:default; position:relative;
  transition:background .18s, box-shadow .18s;
  background:#4a4f52;
}
.lamp::after{
  content:"";position:absolute;top:5px;left:8px;width:14px;height:8px;
  border-radius:50%;background:rgba(255,255,255,.35);
}
.btn{cursor:pointer;border:3px solid #2f3235}
.btn:active{transform:scale(.94)}

.off-green{background:#20563f}
.on-green{background:#2fe08a;box-shadow:0 0 14px 3px rgba(47,224,138,.65)}
.off-teal{background:#12514c}
.on-teal{background:#12d9c0;box-shadow:0 0 14px 3px rgba(18,217,192,.6)}
.off-red{background:#5c1c1c}
.on-red{background:#ff2f2f;box-shadow:0 0 14px 3px rgba(255,47,47,.6)}
.off-amber{background:#5c3f11}
.on-amber{background:#ffa61f;box-shadow:0 0 14px 3px rgba(255,166,31,.65)}
.off-white{background:#8d918f}
.on-white{background:#f6f7ef;box-shadow:0 0 14px 3px rgba(246,247,239,.7)}

/* rotary selector */
/* MAN-OFF-AUTO selector: black bezel with a flat lever and a white marker */
.knob{
  width:42px;height:42px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#37393c 0%,#191a1c 58%,#0a0b0c 100%);
  border:1px solid #060707; position:relative; cursor:pointer;
  box-shadow:0 3px 7px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.14);
}
.knob i{
  position:absolute;left:50%;top:50%;width:15px;height:40px;
  margin-left:-7.5px;margin-top:-20px;border-radius:4px;
  background:linear-gradient(95deg,#303235 0%,#161719 42%,#0c0d0e 100%);
  box-shadow:0 2px 4px rgba(0,0,0,.55);
  transform-origin:50% 50%;
  transition:transform .18s ease;
}
.knob i::after{
  content:"";position:absolute;left:50%;top:5px;width:5px;height:14px;
  margin-left:-2.5px;border-radius:2px;background:#f4f5f0;
  box-shadow:0 0 1px rgba(0,0,0,.5);
}
.knobwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.knobtag{font-size:8.5px;font-weight:700;color:#1d1f21;letter-spacing:.06em}

/* ---------- TIMER DIAL ---------- */
.tpair{display:flex;gap:14px;align-items:flex-start}
.tdial{flex:0 0 auto;background:linear-gradient(160deg,#d8c7a4,#c9b088);
  padding:8px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.22)}
.tdial svg{display:block}
.dialnote{font-size:11px;color:#3c3222;text-align:center;margin:5px 0 0;line-height:1.35}
.dialnote b{font-variant-numeric:tabular-nums;font-size:13px;color:#1d1810}
.dialkey{display:inline-block;margin-top:4px;font-size:10px;color:#4b3f2c}
.tside{flex:1 1 auto;min-width:0}
@media(max-width:470px){.tpair{gap:9px}}

/* ---------- CONTROLS ---------- */
.controls{max-width:520px;margin:24px auto 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px 14px 16px;margin-bottom:14px;
}
.card h2{font-size:13px;margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row:last-child{margin-bottom:0}
label{font-size:13px}
input[type=time]{
  font-family:inherit;font-size:14px;padding:5px 7px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);
}
input[type=range]{width:100%;accent-color:var(--accent)}
.clock{font-size:30px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{
  font:inherit;font-size:12.5px;padding:6px 12px;border:0;cursor:pointer;
  background:transparent;color:var(--fg);
}
.seg button.sel{background:var(--accent);color:#fff}
.mini{font-size:12px;color:var(--muted);line-height:1.5}
.del{font:inherit;font-size:12px;padding:4px 9px;border:1px solid var(--line);
  background:transparent;color:var(--muted);border-radius:6px;cursor:pointer}
.add{font:inherit;font-size:12.5px;padding:6px 11px;border:1px solid var(--accent);
  background:transparent;color:var(--accent);border-radius:7px;cursor:pointer}
.lab{font-size:12.5px;width:96px;color:var(--muted)}
input[type=text],input[type=number],select{font:inherit;font-size:13px;padding:5px 7px;
  border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);max-width:100%}
input[type=text]{flex:1 1 130px;min-width:110px}
input[type=number]{width:70px}
.logrow{border-top:1px solid var(--line);padding:9px 0;font-size:13px;line-height:1.5}
.logrow:first-child{border-top:0}
.logmeta{color:var(--muted);font-size:12px;margin-top:6px}
.rechead{font-weight:600;font-size:13.5px;margin-bottom:5px}
.recline{font-size:13px}
.recrow{display:flex;align-items:baseline;gap:8px;font-size:13.5px;padding:4px 8px;
  border-left:3px solid var(--accent);background:rgba(14,127,108,.07);border-radius:4px;margin-bottom:4px}
.recrow.same{border-left-color:var(--line);background:transparent;padding-left:8px}
.recday{min-width:76px;color:var(--fg);font-size:12px;font-weight:600}
.recrow.same .recday{color:var(--muted);font-weight:400}
.rectime{font-variant-numeric:tabular-nums}
.rectime.old{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.rectime.new{font-weight:700;color:var(--accent)}
.recarrow{color:var(--muted)}
.recnote{color:var(--muted);font-size:12px}
.recrow.same .rectime{color:var(--muted)}
.recwhy{font-size:13px;font-style:italic;color:var(--fg);margin-top:5px}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;
  background:var(--line);margin-right:6px}
.rm{float:right;font:inherit;font-size:11px;padding:2px 7px;border:1px solid var(--line);
  background:transparent;color:var(--muted);border-radius:6px;cursor:pointer}
.setline{font-size:14px;margin-bottom:5px}
.prow{border-left:3px solid var(--line);padding-left:9px;margin-bottom:12px}
.dchips{display:flex;flex-wrap:wrap;gap:4px}
.dchip{font:inherit;font-size:11.5px;padding:4px 8px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted)}
.dchip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.dchip.wide{border-style:dashed;color:var(--accent);border-color:var(--accent);background:transparent}
.photobox{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.checkline{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.checkline .who{font-weight:400;color:var(--muted)}
/* ---------- embedded in the round tracker ---------- */
body.embed{padding:12px 12px 24px}
body.embed h1,body.embed .sub,body.embed #site,body.embed #siteNote,body.embed #ovrNote,
body.embed #pendNote,body.embed #weekNote,body.embed #timerCards,
body.embed #syncNote,body.embed .controls>.card:not(#embedSummary){display:none}
body.embed .controls{margin-top:14px}
body.embed #embedHead{display:block!important}
body.embed .panel{pointer-events:none}          /* a read-only picture of the door */
.emb-now{font-size:15px;margin:0 0 10px;color:var(--muted)}
.emb-now b{font-size:26px;color:var(--fg);font-variant-numeric:tabular-nums;margin-right:6px}
.emb-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.emb-tab{font:inherit;font-size:12.5px;padding:7px 12px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--fg)}
.emb-tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.emb-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:9px 0;
  border-top:1px solid var(--line);font-size:13.5px}
.emb-row:first-of-type{border-top:0}
.emb-name{flex:1 1 auto;min-width:0;font-weight:600}
.emb-state{font-weight:600}
.emb-run{color:#0d7d6b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .emb-run{color:#4cc4ae}}
:root[data-theme="dark"] .emb-run{color:#4cc4ae}
.emb-stop{color:var(--muted)}
.emb-when{flex-basis:100%;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.emb-foot{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.5}
.emb-foot a{color:var(--accent)}
.lastup{font-size:12.5px;color:var(--muted);margin:10px 0 0;padding-top:9px;
  border-top:1px solid var(--line)}
.lastup b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.lastup .lu-lab{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px}
.showrow .lab{width:auto;flex:0 0 auto}
.showrow input[type=time]{font-variant-numeric:tabular-nums}
.showrow .mini{flex:1 1 100%;margin-top:2px}
.showrow .mini.ck-done,.showrow .mini.ck-todo{font-weight:600}
.trec{margin:6px 0 0}
.trec-btn{font:inherit;font-size:12.5px;background:transparent;border:0;padding:2px 0;
  color:var(--accent);cursor:pointer;text-align:left}
.trec-btn:disabled{color:var(--muted);cursor:default}
.trec-body{margin-top:4px;border-left:2px solid var(--line);padding-left:10px}
.rm-link{font:inherit;font-size:11.5px;font-weight:400;background:transparent;border:0;
  color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;margin-left:8px}
.rm-link:hover{color:var(--fg)}
.ck-done{color:#0d7d6b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ck-done{color:#4cc4ae}}
:root[data-theme="dark"] .ck-done{color:#4cc4ae}
.ck-todo{color:#b4611a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ck-todo{color:#e2a15c}}
:root[data-theme="dark"] .ck-todo{color:#e2a15c}
.weeknote{font-size:12.5px;margin:-6px 0 14px;padding:8px 11px;border-radius:8px;
  border:1px solid var(--line);background:var(--card)}
.weeknote b{font-variant-numeric:tabular-nums}
.wk-row{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:6px 0;
  border-top:1px solid var(--line)}
.wk-row:first-child{border-top:0}
.wk-name{flex:1 1 auto;min-width:0}
.wk-count{font-variant-numeric:tabular-nums;font-weight:600}
.wk-row.wk-all .wk-count{color:#0d7d6b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wk-row.wk-all .wk-count{color:#4cc4ae}}
:root[data-theme="dark"] .wk-row.wk-all .wk-count{color:#4cc4ae}
.wk-row.wk-none .wk-count{color:#b4611a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wk-row.wk-none .wk-count{color:#e2a15c}}
:root[data-theme="dark"] .wk-row.wk-none .wk-count{color:#e2a15c}
.tphotos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.tphoto{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:var(--surface);cursor:pointer;width:132px;font:inherit;display:block}
.tphoto img{display:block;width:100%;height:99px;object-fit:cover}
.tphoto .tp-cap{display:block;font-size:10.5px;color:var(--ink-soft,var(--muted));padding:3px 5px;text-align:left}
.tphoto.tp-fail img{display:none}
.tphoto.tp-fail .tp-cap::before{content:"Photo did not load — ";}
#lightbox{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.88);
  align-items:center;justify-content:center;flex-direction:column;padding:16px}
#lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:6px}
#lightbox .lb-cap{color:#e9ebed;font-size:12.5px;margin-top:10px;text-align:center}
#lightbox .lb-close{position:absolute;top:10px;right:14px;background:transparent;border:0;
  color:#fff;font-size:28px;line-height:1;cursor:pointer;padding:6px 10px}
#lightbox .lb-hint{color:#e9ebed;font-size:13px;text-align:center}
#lightbox .lb-hint a{color:#8fd3cb}
.loadbox{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.boardbox{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:13px;margin-top:14px;overflow-x:auto}
.boardbox h2{font-size:12.5px;margin:0 0 9px;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted)}
.boardbox svg{display:block;min-width:520px}
.boardphoto{position:relative;min-width:520px;line-height:0}
.boardphoto img{width:100%;display:block;border-radius:4px}
.bmark{position:absolute;top:6%;height:88%;border:2.5px solid #b9bfb9;border-radius:5px;
  box-sizing:border-box;display:block}
.bmark b{position:absolute;left:50%;transform:translateX(-50%);bottom:-19px;
  font-size:10px;font-weight:700;color:#8a908a;white-space:nowrap;line-height:1}
.bmark.on{border-color:#1f9d55;box-shadow:0 0 0 2px rgba(31,157,85,.25)}
.bmark.on b{color:#1f9d55}
.boardbox{padding-bottom:26px}
.loadbox svg{display:block;max-width:260px}
.signwrap{max-width:300px;border-radius:6px;overflow:hidden;line-height:0}
.signwrap img{width:100%;display:block;transition:filter .3s}
.signwrap.lit img{filter:brightness(1.05) saturate(1.05)}
.signwrap.lit{box-shadow:0 0 18px 4px rgba(90,150,255,.45)}
.signwrap.dark img{filter:brightness(.38) saturate(.35) contrast(.9)}
.loadbox p{margin:4px 0 0}
.logrow{border-top:1px solid var(--line);padding:9px 0;font-size:13px;line-height:1.5}
.logrow:first-child{border-top:0}
.logmeta{color:var(--muted);font-size:12px;margin-top:6px}
.rechead{font-weight:600;font-size:13.5px;margin-bottom:5px}
.recline{font-size:13px}
.recrow{display:flex;align-items:baseline;gap:8px;font-size:13.5px;padding:4px 8px;
  border-left:3px solid var(--accent);background:rgba(14,127,108,.07);border-radius:4px;margin-bottom:4px}
.recrow.same{border-left-color:var(--line);background:transparent;padding-left:8px}
.recday{min-width:76px;color:var(--fg);font-size:12px;font-weight:600}
.recrow.same .recday{color:var(--muted);font-weight:400}
.rectime{font-variant-numeric:tabular-nums}
.rectime.old{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.rectime.new{font-weight:700;color:var(--accent)}
.recarrow{color:var(--muted)}
.recnote{color:var(--muted);font-size:12px}
.recrow.same .rectime{color:var(--muted)}
.recwhy{font-size:13px;font-style:italic;color:var(--fg);margin-top:5px}
label.apply{cursor:pointer}
/* The camera is the main thing a technician does on this card, so it looks
   like a button and is big enough to hit with a thumb in a plant room. */
.photobtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font:inherit;font-size:15px;font-weight:600;line-height:1.1;
  padding:13px 18px;min-height:48px;border-radius:10px;border:0;
  background:var(--accent);color:#fff;cursor:pointer;text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.2);flex:1 1 230px}
.photobtn:active{transform:translateY(1px);filter:brightness(.93)}
.photobtn .cam{font-size:18px}
/* once the week's check is in, it steps back to a quieter outline */
.photobtn.done{background:transparent;color:var(--accent);
  border:1.5px solid var(--accent);box-shadow:none;font-weight:500;
  font-size:13.5px;min-height:40px;padding:9px 14px}
input[type=text]{font:inherit;font-size:13px;padding:5px 7px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);flex:1 1 150px;min-width:130px}
.lab{font-size:12.5px;width:80px;color:var(--muted)}
.setline b{font-variant-numeric:tabular-nums}
#site{font:inherit;font-size:14px;padding:6px 9px;border-radius:7px;
  border:1px solid var(--line);background:var(--card);color:var(--fg)}
.tl{position:relative;height:16px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 2px}
.tl span{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.8}
.tl b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#e2413c}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.state{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.state b{color:var(--fg)}
.clock small{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.dw{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-left:4px}
.drives{font-size:12.5px;line-height:1.55;margin:0 0 8px}
.tlname{font-size:11.5px;color:var(--muted);margin-top:7px}
.warn{color:#b4611a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .warn{color:#e2a15c}}
:root[data-theme="dark"] .warn{color:#e2a15c}
@media(max-width:420px){
  .lamp{width:32px;height:32px}.knob{width:34px;height:34px}.cell{height:46px}
  .strip{font-size:8px;letter-spacing:.04em}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Check timer</h1>
  <p class="sub">What the timers and panel should look like right now. Compare against the real plant room.</p>
  <div class="row" style="margin-bottom:14px">
    <select id="site"></select>
    <span class="mini" id="siteNote"></span>
  </div>
  <p class="mini" id="ovrNote" style="display:none;margin:-6px 0 14px"></p>
  <p class="mini" id="pendNote" style="display:none;margin:-6px 0 14px"></p>
  <p class="weeknote" id="weekNote"></p>
  <div id="embedHead" hidden>
    <p class="emb-now"><b id="embClock">--:--</b> <span id="embDay"></span></p>
    <div class="emb-tabs" id="embTabs"></div>

/* ---------- embedded view ----------
   The dosing round tracker opens this page inside the "check the pump panel"
   job, so a technician standing at the door sees what should be running
   without leaving the round. ?embed=1&outlet=BK strips the page back to the
   door and the timers for that outlet's pump panels. */
var Q = (function(){
  var o={};
  location.search.replace(/^\?/,'').split('&').forEach(function(kv){
    if(!kv) return;
    var i=kv.indexOf('='), k=decodeURIComponent(i<0?kv:kv.slice(0,i));
    o[k] = i<0 ? '' : decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));
  });
  return o;
})();
var EMBED = Q.embed==='1' || Q.embed==='true';
var EMBED_OUTLET = (Q.outlet||'').toUpperCase();
/* the pump panels at one outlet, in picker order — fans and signs left out */
function panelsForOutlet(code){
  code=String(code||'').toUpperCase();
  var keys=ORDER.filter(function(k){ return SITES[k]; })
    .concat(Object.keys(SITES).filter(function(k){ return ORDER.indexOf(k)<0; }));
  return keys.filter(function(k){
    var c=SITES[k];
    return !c.aux && String(c.outlet||k).toUpperCase()===code;
  });
}

var S = { mode:'live', manual:480, day:new Date().getDay(), site:'JEIP1',
          timers:[], pumps:[], heat:[], heatCount:0,
          selLabel:'MAN-OFF-AUTO', tripLabel:'TRIP' };

function loadSite(id){
  if(!SITES[id]) return;
  S.site=id;
  var cfg=SITES[id];
  S.heatCount = (cfg.heatPumps!==undefined) ? cfg.heatPumps : (cfg.heatPump?1:0);
  S.selLabel  = cfg.selector  || 'MAN-OFF-AUTO';
  S.btnStart  = cfg.startLabel || 'START';
  S.btnStop   = cfg.stopLabel  || 'STOP';
  S.tripLabel = cfg.tripLabel || 'TRIP';

  var ovr=readOvr()[id];
  S.timers = cfg.timers.map(function(t,ti){
    var sch = (ovr && ovr[ti]) ? ovr[ti] : t.sch;
    return {label:t.label, device:(t.device||'hager'), model:(t.model||''),
            controls:(t.controls||null), controlsOff:(t.controlsOff||null), note:(t.note||''),
            row:(t.row||''), extra:(t.extra||''), rowTitle:(t.rowTitle||''),
            noTimer:!!t.noTimer, startSel:(t.startSel||''),
            load:(t.load||''), hz:(t.hz||''),
            needsFlow:!!t.needsFlow, tsw:'auto',
            /* days come from the pool's saved settings; an edit on the phone
               changes the times only, so they are carried across */
            sch:sch.map(function(w,j){
              var src=t.sch[j];
              return {on:w.on, off:w.off, days:(w.days||(src&&src.days)||null)};
            })};
  });

  S.heatStyle = cfg.heatStyle || 'on';
  var pw=document.getElementById('panelWrap');
  if(pw) pw.style.display = cfg.noPanel ? 'none' : '';
  var bw=document.getElementById('boardWrap');
  if(bw){
    if(cfg.board){ bw.innerHTML=boardSvg(); bw.style.display=''; }
    else { bw.innerHTML=''; bw.style.display='none'; }
  }
  S.pumps=[];
  S.timers.forEach(function(t,ti){
    if(t.controls===null && t.panelOff) return;
    var names = t.controls || [t.label];
    names.forEach(function(nm){
      S.pumps.push({label:nm, t:ti, row:(t.row||''), extra:(t.extra||''), rowTitle:(t.rowTitle||''),
                    invert:false, needsFlow:t.needsFlow,
                    flow:!t.needsFlow, noTimer:!!t.noTimer,
                    sel:(t.startSel||'AUTO'), tripped:false, manRun:(t.startSel!=='OFF')});
    });
    (t.controlsOff||[]).forEach(function(nm){
      S.pumps.push({label:nm, t:ti, row:(t.row||''), invert:true, needsFlow:false,
                    flow:true, sel:'AUTO', tripped:false, manRun:true});
    });
  });

  S.heat=[]; for(var k=0;k<S.heatCount;k++) S.heat.push('ON');

  try{ localStorage.setItem('timerSite', id); }catch(e){}
  cloudWatch(id);
  var sup=document.getElementById('supplyTitle');
  if(sup) sup.textContent = cfg.supply || 'MAIN INCOMING LIGHT';
  /* Some doors carry all three phases, others just one lamp. */
  var sl=document.getElementById('supplyLamps');
  if(sl){
    var nl = cfg.supplyLamps!==undefined ? cfg.supplyLamps : 3;
    if(nl<=0){ sl.innerHTML=''; }
    else if(nl===1){
      sl.innerHTML='<div class="cell"><div class="lamp on-white"></div></div>';
    }else{
      var lab='', lamp='';
      for(var q=1;q<=nl;q++){
        lab+='<div class="strip">L'+q+'</div>';
        lamp+='<div class="cell"><div class="lamp on-white"></div></div>';
      }
      sl.innerHTML='<div class="grid'+nl+'">'+lab+'</div><div class="grid'+nl+'">'+lamp+'</div>';
    }
  }
  var nt=document.getElementById('siteNote');
  if(nt) nt.textContent = cfg.note || 'Timer settings for this pool';
  buildPanel(); buildCards(); drawOvrNote(); drawHistory(); buildHowTo();
}

  var html = S.pumps.map(function(p,i){
    if(p.row==='onlamp'){
      return '<div class="block">'+
        '<div class="strip titlebar" style="width:40%;margin:0 auto 4px">'+p.label.toUpperCase()+'</div>'+
        '<div class="grid2"><div class="strip">OFF-ON</div><div class="strip">ON</div></div>'+
        '<div class="grid2">'+
          '<div class="cell"><div class="knobwrap"><div class="knob" data-knob="'+i+'"><i></i></div>'+
            '<div class="knobtag" id="k'+i+'tag">AUTO</div></div></div>'+
          '<div class="cell"><div class="lamp" id="run'+i+'"></div></div>'+
        '</div></div>';
    }
    if(p.row==='simple'){
      var cols = p.extra ? 'grid4' : 'grid3';
      return '<div class="block">'+
        '<div class="'+cols+'"><div class="strip sel3">'+S.selLabel+'</div>'+
        '<div class="strip">'+p.label.toUpperCase()+'</div><div class="strip">STOP</div>'+
        (p.extra?'<div class="strip">'+p.extra+'</div>':'')+'</div>'+
        '<div class="'+cols+'">'+
          '<div class="cell"><div class="knobwrap"><div class="knob" data-knob="'+i+'"><i></i></div>'+
            '<div class="knobtag" id="k'+i+'tag">AUTO</div></div></div>'+
          '<div class="cell"><div class="lamp" id="run'+i+'"></div></div>'+
          '<div class="cell"><div class="lamp" id="stp'+i+'"></div></div>'+
          (p.extra?'<div class="cell"><div class="lamp" id="xlamp'+i+'"></div></div>':'')+
        '</div></div>';
    }
    if(p.row==='fan'){
      return '<div class="block">'+
        '<div class="grid3"><div class="strip">RUN</div><div class="strip">STOP</div>'+
        '<div class="strip">'+S.tripLabel+'</div></div>'+
        '<div class="grid3">'+
          '<div class="cell"><div class="lamp" id="run'+i+'"></div></div>'+
          '<div class="cell"><div class="lamp" id="stp'+i+'"></div></div>'+
          '<div class="cell"><div class="lamp" id="trp'+i+'" data-press="trip'+i+'" style="cursor:pointer"></div></div>'+
        '</div>'+
        '<div class="grid3" style="margin-top:10px"><div class="strip sel3">'+S.selLabel+'</div>'+
        '<div class="strip">START</div><div class="strip">STOP</div></div>'+
        '<div class="grid3">'+
          '<div class="cell"><div class="knobwrap"><div class="knob" data-knob="'+i+'"><i></i></div>'+
            '<div class="knobtag" id="k'+i+'tag">AUTO</div></div></div>'+
          '<div class="cell"><div class="lamp btn off-green" data-press="start'+i+'"></div></div>'+
          '<div class="cell"><div class="lamp btn off-red" data-press="stop'+i+'"></div></div>'+
        '</div></div>';
    }
    if(p.row==='heater'){
      return '<div class="block">'+
        (p.rowTitle==='span'
          ? '<div class="strip titlebar span">'+p.label.toUpperCase()+'</div>'
          : '<div class="htitle"><div class="strip">'+p.label.toUpperCase()+'</div>'+
            '<div class="strip">HEATER</div></div>')+
        '<div class="grid5"><div class="strip sel3">'+S.selLabel+'</div><div class="strip">START</div>'+
        '<div class="strip">STOP</div><div class="strip">ON</div><div class="strip">OFF</div></div>'+
        '<div class="grid5">'+
          '<div class="cell"><div class="knobwrap"><div class="knob" data-knob="'+i+'"><i></i></div>'+
            '<div class="knobtag" id="k'+i+'tag">AUTO</div></div></div>'+
          '<div class="cell"><div class="lamp btn off-green" data-press="start'+i+'"></div></div>'+
          '<div class="cell"><div class="lamp btn off-red" data-press="stop'+i+'"></div></div>'+
          '<div class="cell"><div class="lamp" id="run'+i+'"></div></div>'+
          '<div class="cell"><div class="lamp" id="stp'+i+'"></div></div>'+
        '</div></div>';
    }
    return '<div class="block">'+
      '<div class="strip titlebar span">'+p.label.toUpperCase()+'</div>'+
      '<div class="grid6"><div class="strip sel3">'+S.selLabel+'</div><div class="strip">'+S.btnStart+'</div>'+
      '<div class="strip">'+S.btnStop+'</div><div class="strip">RUN</div><div class="strip">STOP</div>'+
      '<div class="strip">'+S.tripLabel+'</div></div>'+
      '<div class="grid6">'+
        '<div class="cell"><div class="knobwrap"><div class="knob" data-knob="'+i+'"><i></i></div>'+
          '<div class="knobtag" id="k'+i+'tag">AUTO</div></div></div>'+
        '<div class="cell"><div class="lamp btn off-green" data-press="start'+i+'"></div></div>'+
        '<div class="cell"><div class="lamp btn off-red" data-press="stop'+i+'"></div></div>'+
        '<div class="cell"><div class="lamp" id="run'+i+'"></div></div>'+
        '<div class="cell"><div class="lamp" id="stp'+i+'"></div></div>'+
        '<div class="cell"><div class="lamp" id="trp'+i+'" data-press="trip'+i+'" style="cursor:pointer"></div></div>'+
      '</div></div>';
  }).join('');


  for(var k=0;k<S.heatCount;k++){
    html += '<div class="block"'+(k===S.heatCount-1?' style="margin-bottom:4px"':'')+'>'+
      '<div class="strip titlebar" style="width:52%;margin:0 auto 4px">HEAT PUMP'+
        (S.heatCount>1?' '+(k+1):'')+'</div>'+
      (S.heatStyle==='runstop'
        ? '<div class="grid3"><div class="strip">OFF-ON</div><div class="strip">RUN</div>'+
          '<div class="strip">STOP</div></div>'+
          '<div class="grid3">'+
          '<div class="cell"><div class="knobwrap"><div class="knob" data-knob="heat'+k+'"><i></i></div>'+
            '<div class="knobtag" id="kh'+k+'tag">ON</div></div></div>'+
          '<div class="cell"><div class="lamp" id="hplamp'+k+'"></div></div>'+
          '<div class="cell"><div class="lamp" id="hpstop'+k+'"></div></div></div>'
        : '<div class="grid2"><div class="strip">OFF-ON</div><div class="strip">ON</div></div>'+
          '<div class="grid2">'+
          '<div class="cell"><div class="knobwrap"><div class="knob" data-knob="heat'+k+'"><i></i></div>'+
            '<div class="knobtag" id="kh'+k+'tag">ON</div></div></div>'+
          '<div class="cell"><div class="lamp" id="hplamp'+k+'"></div></div></div>')+
      '</div>';
  }
  document.getElementById('panelPumps').innerHTML = html;
}

function drawVsd(i, running, hz){
  document.getElementById('vhz'+i).textContent = hz;        /* set point, shown either way */
  document.getElementById('vrun'+i).setAttribute('fill', running ? '#28d17c' : '#1c5f3a');
  document.getElementById('vled'+i).setAttribute('fill', running ? '#ff3b30' : '#5c2320');
  document.getElementById('vcap'+i).textContent = running
    ? 'Fan running at '+hz+' Hz'
    : 'Fan stopped — display still reads '+hz+' Hz';
  var f=document.getElementById('vfan'+i);
  if(f) f.setAttribute('opacity', running ? '1' : '0.55');

/* SUL 181 d: hours read anti-clockwise from the pointer on the right.
   Case legend: rider pushed OUT = 0 (off), pushed IN = 1 (on). */
function drawTheben(i,m){
  var t=S.timers[i], CX=106, CY=142, g='';
  function pt(mins, r){                       /* now sits at the top mark */
    var a=(-90 - ((mins-m)/1440)*360) * Math.PI/180;
    return [CX+r*Math.cos(a), CY+r*Math.sin(a)];
  }
  function polar(deg, r){
    var a=(deg-90)*Math.PI/180;
    return [CX+r*Math.cos(a), CY+r*Math.sin(a)];
  }
  for(var k=0;k<96;k++){
    var on=timerOn(t, k*15+7);
    var r1= on?46:56, r2= on?55:65;
    var a=pt(k*15, r1), b=pt(k*15, r2);
    g+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+
       '" y2="'+b[1].toFixed(1)+'" stroke="'+(on?'#2a4fa8':'#b9c4d6')+
       '" stroke-width="'+(on?'3':'2.4')+'" stroke-linecap="round"/>';
  }
  for(var h=2;h<=24;h+=2){
    var q=pt(h*60, 37);
    g+='<text x="'+q[0].toFixed(1)+'" y="'+(q[1]+3).toFixed(1)+'" text-anchor="middle" '+
       'font-family="Arial" font-size="8" fill="#3b3e3b">'+h+'</text>';
  }
  document.getElementById('rdial'+i).innerHTML=g;

  /* hour marks on the inner 12-hour face */
  var marks='';
  for(var q=0;q<12;q++){
    var a1=polar(q*30, 30), a2=polar(q*30, 38);
    marks+='<line x1="'+a1[0].toFixed(1)+'" y1="'+a1[1].toFixed(1)+'" x2="'+a2[0].toFixed(1)+
           '" y2="'+a2[1].toFixed(1)+'" stroke="#6a6d6a" stroke-width="'+(q%3===0?2.4:1.4)+'"/>';
  }
  document.getElementById('rmark'+i).innerHTML=marks;

  /* long minute hand, short hour hand with a triangular tip */
  var mins=((Math.round(m)%1440)+1440)%1440, hh=mins/60, mm=mins%60;
  var mDeg=(mm/60)*360, hDeg=((hh%12)/12)*360;
  var mTip=polar(mDeg, 40);
  var hTip=polar(hDeg, 25), hL=polar(hDeg-7, 17), hR=polar(hDeg+7, 17);
  document.getElementById('rhand'+i).innerHTML=
    '<line x1="'+CX+'" y1="'+CY+'" x2="'+mTip[0].toFixed(1)+'" y2="'+mTip[1].toFixed(1)+
      '" stroke="#3b3e3b" stroke-width="3" stroke-linecap="round"/>'+
    '<path d="M'+hL[0].toFixed(1)+' '+hL[1].toFixed(1)+' L'+hTip[0].toFixed(1)+' '+hTip[1].toFixed(1)+
      ' L'+hR[0].toFixed(1)+' '+hR[1].toFixed(1)+' Z" fill="#3b3e3b"/>';

  /* the three windows read 3/6/9 before noon and 15/18/21 after it */
  var pm = mins>=720;
  document.getElementById('w3'+i).textContent = pm?'15':'3';
  document.getElementById('w6'+i).textContent = pm?'18':'6';
  document.getElementById('w9'+i).textContent = pm?'21':'9';

  document.getElementById('rmdl'+i).textContent=t.model||'';
  document.getElementById('ts'+i).setAttribute('transform',
    t.tsw==='on' ? 'translate(-28,0)' : 'translate(0,0)');
}

/* The disc turns clockwise past a fixed pointer at the top, so a time still to
   come sits anti-clockwise of it — which is why the hours read anti-clockwise.
   A segment pushed OUT towards the rim switches on; pushed IN towards the
   centre it is off, so the two sit at different radii, not just colours. */
function drawRound(i,m){
  var t=S.timers[i], CX=82, CY=82, g='';
  function pt(mins, r){
    var a=(-90 - ((mins-m)/1440)*360) * Math.PI/180;
    return [CX+r*Math.cos(a), CY+r*Math.sin(a)];
  }
  for(var k=0;k<96;k++){
    var on=timerOn(t, k*15+7);
    var r1= on?57:45, r2= on?69:56;
    var a=pt(k*15, r1), b=pt(k*15, r2);
    g+='<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+
       '" y2="'+b[1].toFixed(1)+'" stroke="'+(on?'#2f74ad':'#b9bfb9')+
       '" stroke-width="'+(on?'3':'2.4')+'" stroke-linecap="round"/>';
  }
  for(var h=1;h<=24;h++){
    var q=pt(h*60, 34);
    g+='<text x="'+q[0].toFixed(1)+'" y="'+(q[1]+3).toFixed(1)+'" text-anchor="middle" '+
       'font-family="Arial" font-size="7.5" fill="#3b3e3b">'+h+'</text>';
  }
  document.getElementById('rdial'+i).innerHTML=g;
  document.getElementById('rmdl'+i).textContent=t.model||'';
  document.getElementById('ts'+i).setAttribute('transform',
    t.tsw==='on' ? 'translate(22,0)' : 'translate(0,0)');
}

function drawDigital(i,m,today){
  var t=S.timers[i];
  if(today===undefined) today=nowDay();
  document.getElementById('lcd'+i).textContent=fmt(m);
  document.getElementById('mdl'+i).textContent=t.model||'Digital time switch';
  var h='';
  for(var k=0;k<7;k++){
    var d=(k+1)%7, x=22+k*13;            /* the unit prints MO…SU */
    h+='<text x="'+x+'" y="56" text-anchor="middle" opacity="'+(d===today?1:0.35)+'" '+
       'font-weight="'+(d===today?'bold':'normal')+'">'+DAYSH[d]+'</text>';
    if(d===today) h+='<rect x="'+(x-7)+'" y="60" width="14" height="2" fill="#1f2a1c"/>';
  }
  document.getElementById('days'+i).innerHTML=h;
  var on=contact(t,m,today);
  document.getElementById('lcdout'+i).setAttribute('fill', on?'#1f2a1c':'#7d8a78');
  document.getElementById('lcdmode'+i).textContent = t.tsw==='on' ? 'MAN' : 'AUTO';
  document.getElementById('ts'+i).setAttribute('transform',
    t.tsw==='on' ? 'translate(-32,0)' : 'translate(0,0)');
}

/* Paste the same Apps Script relay address the dosing photos use.
   Leave it empty and the photo buttons stay hidden. */
var RELAY_URL='https://script.google.com/macros/s/AKfycbxLnXRzG3VsI9S0f801ju-Id8OqKHHgVMi_350Y98oZz3OJiM0NuoF5r95S9kgK7Vg6xg/exec';
var RELAY_KEY='happyfish2026';

/* The time the photo was taken is the point of the photo: it is what the
   timer's own display gets compared against. So it is burned in large on the
   first line, with the pool, the unit and the technician underneath. */
function shrinkAndStamp(file, lines, cb){
  if(typeof lines==='string') lines=[lines];
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height, max=1280;
      if(w>max||h>max){ var k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); }
      var big=Math.max(22, Math.round(w/26)), small=Math.max(13, Math.round(w/52));
      var pad=Math.round(big*0.45);
      var band=pad*2 + big + (lines.length-1)*Math.round(small*1.45);
      var c=document.createElement('canvas'); c.width=w; c.height=h+band;
      var x=c.getContext('2d');
      x.fillStyle='#111'; x.fillRect(0,0,c.width,c.height);
      x.drawImage(img,0,0,w,h);
      x.textBaseline='top'; x.fillStyle='#fff';
      var y=h+pad;
      x.font='bold '+big+'px Arial';
      x.fillText(lines[0], pad, y);
      y+=Math.round(big*1.08);
      x.font=small+'px Arial'; x.fillStyle='#d9dcde';
      for(var i=1;i<lines.length;i++){
        x.fillText(lines[i], pad, y); y+=Math.round(small*1.45);
      }
      cb(c.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}

/* A timer that lost power runs slow, and the pump hours quietly shift with it.
   The technician reads the unit's own display into this box; the page does the
   subtraction, so nobody has to squint at two clocks. */
function driftMinutes(shownHHMM, when){
  if(!/^\d{1,2}:\d{2}$/.test(shownHHMM||'')) return null;
  var actual=when.getHours()*60+when.getMinutes();
  var d=((toMin(shownHHMM) - actual + 720 + 1440) % 1440) - 720;   /* nearest way round midnight */
  return d;
}
function driftWord(d){
  if(d===null || d===undefined) return '';
  var a=Math.abs(d);
  if(a<=2) return 'clock correct';
  var txt = a>=60 ? Math.floor(a/60)+' h '+(a%60?(a%60)+' min':'') : a+' min';
  return txt.trim()+(d<0?' slow':' fast');
}
function driftClass(d){
  if(d===null || d===undefined) return '';
  return Math.abs(d)<=2 ? 'ck-done' : 'ck-todo';
}

/* The relay hands back a one-time redirect, so two photos posted at the same
   moment collide and one comes back 404. Uploads go one at a time, and a
   blip is retried rather than thrown at the technician. */
var relayChain = Promise.resolve();
function relayUpload(payload){
  var run = function(){ return relayTry(payload); };
  var next = relayChain.then(run, run);
  relayChain = next['catch'](function(){});
  return next;
}
function relayTry(payload){
  var tries = 3;
  function attempt(n){
    return relayPost(payload)['catch'](function(e){
      if(e.relay && !e.transient) throw e;        // the relay said no: retrying won't help
      if(n >= tries) throw e;
      return new Promise(function(r){ setTimeout(r, 900 * Math.pow(2, n-1)); })
        .then(function(){ return attempt(n+1); });
    });
  }
  return attempt(1);
}
function relayPost(payload){
  return fetch(RELAY_URL, {method:'POST', headers:{'Content-Type':'text/plain'},
                           body: JSON.stringify(payload)})
    .then(function(r){
      return r.text().then(function(body){ return {status:r.status, body:body}; });
    }, function(){
      var e=new Error('network'); e.network=true; throw e;
    })
    .then(function(out){
      var j=null;
      try{ j=JSON.parse(out.body); }catch(e){}
      if(!j){
        var e1=new Error('HTTP '+out.status); e1.relay=true;
        e1.transient = out.status===404 || out.status===429 || out.status>=500 || out.status===0;
        throw e1;
      }
      if(!j.ok){ var e2=new Error(j.error||'refused'); e2.relay=true; throw e2; }
      return j;
    });
}
function photoError(e){
  if(e && e.network) return "Upload didn't go through — check the signal and try again.";
  if(e && e.relay && !e.transient){
    if(/bad key/i.test(e.message)) return 'The relay key here does not match the relay — nothing wrong with the photo.';
    if(/no image/i.test(e.message)) return 'The photo did not reach the relay. Try again.';
    return 'The relay refused it: '+e.message;
  }
  return "The relay was busy and didn't take it. Try again.";
}

function sendPhoto(i, file){
  var p=S.timers[i], msg=document.getElementById('pmsg'+i);
  /* A proof photo with no name on it proves little, so ask once and remember. */
  var wi=document.getElementById('pwho'+i);
  var typed = wi ? (wi.value||'').trim() : '';
  if(typed && typed!==WHO){ WHO=typed; try{ localStorage.setItem('timerWho', WHO); }catch(e){} }
  var who=WHO||'';
  if(!who){
    msg.textContent='Put your name in first — the photo is the proof that you did the check.';
    if(wi) wi.focus();
    return;
  }
  var now=new Date();
  var si=document.getElementById('pshow'+i);
  var shows=si ? (si.value||'').trim() : '';
  var drift=driftMinutes(shows, now);
  var clock=pad(now.getHours())+':'+pad(now.getMinutes());
  var lines=[
    clock+'  ·  '+DAYS[now.getDay()].slice(0,3)+' '+now.getDate()+' '+MON[now.getMonth()],
    SITES[S.site].name+' · '+p.label,
    (who||'technician') + (shows ? '   ·   timer shows '+shows+' — '+driftWord(drift) : '')
  ];
  msg.textContent='Uploading photo…';
  shrinkAndStamp(file, lines, function(b64){
    if(!b64){ msg.textContent='Could not read that photo — try again.'; return; }
    var today = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
    relayUpload({key:RELAY_KEY, kind:'timer',
                 outlet:SITES[S.site].name, pool:SITES[S.site].name,
                 job:p.label, person:(who||'technician'), date:today,
                 tool:'none', wantReading:false, imageBase64:b64})
      .then(function(j){
        addRecord({kind:'photo', timer:p.label, who:who,
                   fileId:j.fileId||null, thumb:j.thumb||null,
                   link:(j.url||j.link||null),
                   shows:shows||null, clock:clock,
                   driftMin:(drift===null?null:drift),
                   reason:(document.getElementById('pnote'+i).value||'').trim()});
        msg.textContent = drift!==null && Math.abs(drift)>2
          ? 'Photo saved — the clock is '+driftWord(drift)+'. Correct it and note it down.'
          : 'Photo saved — this timer is marked checked for the week.';
        document.getElementById('pnote'+i).value='';
        if(si) si.value='';
        var hint=document.getElementById('pdrift'+i);
        if(hint){ hint.textContent=''; hint.className='mini'; }
      })['catch'](function(e){
        msg.textContent=photoError(e);
        console.log('timer photo relay error', e);
      });
  });
}

/* Drive's /view link makes the phone ask which Google account to use. The
   thumbnail address needs no sign-in for a link-shared file, so photos are
   shown in the page instead. */
function driveImg(fileId, w){
  return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(fileId)+'&sz=w'+(w||1600);
}
function fileIdOf(r){
  if(r.fileId) return r.fileId;
  var m=/\/d\/([^\/]+)/.exec(r.link||'') || /[?&]id=([^&]+)/.exec(r.link||'');
  return m ? m[1] : null;
}
function photoThumbHtml(r){
  var id=fileIdOf(r);
  if(!id) return r.link ? '<a href="'+r.link+'" target="_blank" rel="noopener">open photo</a>' : '';
  var when = r.clock || (r.at ? pad(new Date(r.at).getHours())+':'+pad(new Date(r.at).getMinutes()) : '');
  var cap = r.timer+' · '+(r.who||'')+' · '+stamp(r.at)+
            (r.shows ? ' · timer read '+r.shows+' ('+driftWord(r.driftMin)+')' : '');
  return '<div class="tphotos"><button type="button" class="tphoto" data-photoview="'+id+
    '" data-photocap="'+esc(cap)+'">'+
    '<img src="'+driveImg(id,400)+'" alt="" loading="lazy" '+
    'onerror="this.parentNode.classList.add(\'tp-fail\')"><span class="tp-cap">Taken '+
    esc(when)+'</span></button></div>';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function openPhoto(fileId, caption){
  var lb=document.getElementById('lightbox');
  lb.querySelector('.lb-cap').textContent=caption||'';
  var img=lb.querySelector('img');
  lb.querySelector('.lb-hint').style.display='none';
  img.style.display='';
  img.onerror=function(){
    img.style.display='none';
    lb.querySelector('.lb-hint').style.display='';
    lb.querySelector('.lb-open').href='https://drive.google.com/file/d/'+fileId+'/view';
  };
  img.src=driveImg(fileId,1600);
  lb.style.display='flex';
}

function boardSvg(){
  return '<div class="boardbox"><h2>Distribution board</h2>'+
  '<div class="boardphoto">'+
    '<img src="'+BOARD_IMG+'" alt="CC pumps 2 and 4 distribution board">'+
    '<span class="bmark" id="bm0" style="left:47.5%;width:7.5%"><b>Pump 2</b></span>'+
    '<span class="bmark" id="bm1" style="left:73.5%;width:7.5%"><b>Pump 4</b></span>'+
  '</div><p class="mini" id="boardCap"></p></div>';
}

function drawBoard(){
  var names=[];
  S.timers.forEach(function(t,i){
    var lit = contact(t, nowMin(), S.day);
    var m=document.getElementById('bm'+i);
    if(m) m.className = 'bmark' + (lit?' on':'');
    if(lit) names.push((t.controls&&t.controls[0])||t.label);
  });
  var cap=document.getElementById('boardCap');
  if(cap) cap.textContent = (names.length
    ? 'Contact closed now: '+names.join(', ')
    : 'Both contacts open — nothing running from this board now')
    + ' · the two marked modules are the timers';
}

function buildCards(){
  document.getElementById('timerCards').innerHTML = S.timers.map(function(t,i){
    if(t.noTimer){
      return '<div class="card"><h2>'+t.label+'</h2>'+
        '<p class="mini">'+(t.note||'No timer fitted.')+'</p></div>';
    }
    var names = (t.controls||[]).concat(t.controlsOff||[]);

/* ---------- the weekly check ----------
   Every timer is checked once a week: is it running, and is its clock right?
   The photo is the proof, so there is nothing to tick — taking the photo is
   what records the check. The week runs Monday to Sunday. */
function weekStart(){
  var x=new Date(); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return x.getTime();
}
function checkedThisWeek(site, timerLabel){
  var start=weekStart();
  for(var i=0;i<LOG.length;i++){
    var r=LOG[i];
    if(r.kind==='photo' && r.site===site && r.timer===timerLabel &&
       new Date(r.at).getTime()>=start) return r;         /* LOG is newest first */
  }
  return null;
}
function realTimers(site){
  return (SITES[site].timers||[]).filter(function(t){ return !t.noTimer; });
}
function checkTally(site){
  var list=realTimers(site), done=0;
  list.forEach(function(t){ if(checkedThisWeek(site, t.label)) done++; });
  return {done:done, total:list.length};
}
function shortStamp(iso){
  var d=new Date(iso);
  return DAYS[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MON[d.getMonth()]+
         ' · '+pad(d.getHours())+':'+pad(d.getMinutes());
}
/* Each timer carries its own history, so a technician standing at one unit
   reads only that unit's entries. It stays shut until asked for. */
var TREC_OPEN={};
function recordsFor(site, timerLabel){
  return LOG.filter(function(r){ return r.site===site && r.timer===timerLabel; });
}
function lastChange(site, timerLabel){
  var rows=recordsFor(site, timerLabel);
  for(var i=0;i<rows.length;i++){ if(rows[i].kind!=='photo') return rows[i]; }
  return null;
}
function drawTimerRecords(){
  S.timers.forEach(function(t,i){
    var lu=document.getElementById('lu'+i);
    if(lu){
      var ch=lastChange(S.site, t.label);
      lu.innerHTML = ch
        ? '<span class="lu-lab">Times last changed</span> <b>'+esc(stamp(ch.at))+'</b>'+
          (ch.who?' <span class="lu-who">· '+esc(ch.who)+'</span>':'')
        : '<span class="lu-lab">Times never changed here</span> '+
          '<span class="lu-who">· still the settings this page was set up with</span>';
    }
    var btn=document.getElementById('trb'+i), body=document.getElementById('trl'+i);
    if(!btn || !body) return;
    var rows=recordsFor(S.site, t.label);
    var open=!!TREC_OPEN[t.label];
    btn.textContent = (open?'▾ ':'▸ ')+'Record for this timer'+(rows.length?' ('+rows.length+')':' — nothing yet');
    btn.disabled = !rows.length;
    body.hidden = !open || !rows.length;
    if(open && rows.length){
      body.innerHTML = rows.map(function(r){ return recordRowHtml(r, false); }).join('');
    }
  });
}

function drawChecks(){
  drawTimerRecords();
  S.timers.forEach(function(t,i){

      ? '<span class="ck-done">✓ Checked this week</span>'+

        (rec.shows ? '<span style="flex-basis:100%" class="'+driftClass(rec.driftMin)+'">'+
          'Timer read <b>'+esc(rec.shows)+'</b> against <b>'+esc(rec.clock||'')+'</b> on the phone — '+
          esc(driftWord(rec.driftMin))+'</span>' : '')+
        (fileIdOf(rec) ? '<span style="flex-basis:100%">'+photoThumbHtml(rec)+'</span>' : '')+

        : '<b>'+SITES[S.site].name+'</b> — <b>'+t.done+' of '+t.total+'</b> timer'+
          (t.total>1?'s':'')+' checked this week. '+(t.total-t.done)+' still to do.';
  }

/* Every pool on one list, so a supervisor can see who is behind without
   opening each panel in turn. */
function drawWeekAll(){
  var box=document.getElementById('weekAll'); if(!box) return;
  var keys=ORDER.filter(function(k){ return SITES[k]; })
    .concat(Object.keys(SITES).filter(function(k){ return ORDER.indexOf(k)<0; }));
  var doneAll=0, totalAll=0;
  box.innerHTML = keys.map(function(k){
    var t=checkTally(k); doneAll+=t.done; totalAll+=t.total;
    var cls = t.total && t.done>=t.total ? 'wk-all' : (t.done===0 ? 'wk-none' : '');
    return '<div class="wk-row '+cls+'"><span class="wk-name">'+esc(SITES[k].name)+'</span>'+

  if(cap) cap.textContent = 'Week of '+new Date(weekStart()).getDate()+' '+
    MON[new Date(weekStart()).getMonth()]+' · '+doneAll+' of '+totalAll+' timers checked';
}

function toMin(t){ var p=t.split(':'); return (+p[0])*60 + (+p[1]); }
function pad(n){ return (n<10?'0':'')+n; }
function fmt(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); }
function nowMin(){
  if(S.mode==='manual') return S.manual;
  var d=new Date(); return d.getHours()*60+d.getMinutes();
}
function nowDay(){ return S.mode==='manual' ? S.day : new Date().getDay(); }
/* A period can be limited to certain days. When it crosses midnight the days
   listed are the days it STARTS on, so the tail after midnight belongs to the
   day before — the way the time switch itself counts it. */
function inWindow(w, m, d){
  var a=toMin(w.on), b=toMin(w.off), days=w.days||null;
  if(a===b) return false;
  function ok(x){ return !days || days.indexOf(x)>=0; }
  if(d===undefined) d=nowDay();
  if(a<b) return (m>=a && m<b) && ok(d);
  if(m>=a) return ok(d);
  if(m<b)  return ok((d+6)%7);
  return false;
}
function timerOn(p, m, d){ for(var i=0;i<p.sch.length;i++){ if(inWindow(p.sch[i],m,d)) return true; } return false; }
function contact(t, m, d){
  if(t.tsw==='on') return true;
  return timerOn(t, m, d);
}
/* what the timer asks of this row, before the selector and the flow rule */
function demand(p, m, d){
  var on=contact(S.timers[p.t], m, d);
  return p.invert ? !on : on;
}
function running(p, m, d){
  if(p.tripped) return false;
  if(p.sel==='OFF') return false;
  if(p.sel==='MAN') return p.manRun;
  return demand(p, m, d);
}
/* Circulation first, then anything that cannot run without flow. */
function runState(m, d){
  var out=S.pumps.map(function(p){ return running(p,m,d); });
  var flow=S.pumps.some(function(p,i){ return p.flow && out[i]; });
  S.pumps.forEach(function(p,i){ if(p.needsFlow && !flow) out[i]=false; });
  return {run:out, flow:flow};
}
var DAYSH=['SU','MO','TU','WE','TH','FR','SA'];
var DAYFULL=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dayWord(list){
  if(!list || !list.length) return '';
  if(list.length===7) return 'every day';
  var ord=list.map(function(d){ return (d+6)%7; }).sort(function(a,b){ return a-b; });  /* Mon=0 */
  var nm=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var run=true;
  for(var i=1;i<ord.length;i++) if(ord[i]!==ord[i-1]+1) run=false;
  if(ord.length===1) return nm[ord[0]];
  if(run) return nm[ord[0]]+'–'+nm[ord[ord.length-1]];
  return ord.map(function(o){ return nm[o]; }).join(' ');
}

var ANG={MAN:-45, OFF:0, AUTO:45, ON:45};

function parseSchText(txt){
  var out=[], re=/(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})\s*(?:\(([^)]+)\))?/g, m;
  while((m=re.exec(txt))!==null)
    out.push({time:m[1]+'–'+m[2], days:(m[3]||'Every day')});
  return out;
}
function fmtSchAll(timers){
  return timers.map(function(t){ return fmtSch(t.sch); }).join(' · ');
}
function schList(sch){
  return sch.map(function(w){
    return {time:w.on+'–'+w.off, days:(w.days?dayWord(w.days):'Every day')};
  });
}
function fmtSch(sch){
  return sch.length ? sch.map(function(w){
    return w.on+'–'+w.off+' ('+(w.days?dayWord(w.days):'Mon–Sun')+')';
  }).join(', ') : 'none set';
}

        h+='<button class="dchip'+(on?' sel':'')+'" data-day="'+i+'-'+j+'-'+d+'">'+

      });
      h+='<button class="dchip wide" data-day="'+i+'-'+j+'-all">Every day</button></span></div>';

     '<div class="row"><button class="add" data-savedit="'+i+'">Save change</button>'+
       '<button class="del" data-canceledit="'+i+'">Cancel</button>'+

/* The wrong photo happens: the camera fires early, or a technician taps the
   wrong timer. Taking it back out puts the timer back to "not checked", so
   the week's list stays honest. The picture itself is already in Drive and
   has gone to the group, so nothing is quietly erased. */
function removeRecord(id){
  if(!id) return;
  var r = null;
  for(var i=0;i<LOG.length;i++){ if(LOG[i].id===id){ r=LOG[i]; break; } }
  var what = r && r.kind==='photo'
    ? 'Remove this photo from the record?\n\n'+(r.timer||'')+
      '\n'+(r.who||'')+' · '+(r.at?shortStamp(r.at):'')+
      '\n\nThe timer goes back to "not checked this week". The photo stays in Drive and in the group chat.'
    : 'Remove this entry from the record?';
  if(!confirm(what)) return;
  LOG = LOG.filter(function(x){ return x.id!==id; });
  saveLog(); drawHistory(); drawChecks();
  if(CLOUD) CLOUD.collection(LOG_COLL).doc(id).delete()['catch'](function(){
    CLOUD_OK=false; syncNote();
  });
}

var HIST_STEP=6, histShown=HIST_STEP;
/* One entry, drawn the same way whether it is read on its own timer's card or
   in the pool's list. `showTimer` is off on a timer's own card, where the
   heading would only repeat the card title. */
function recordRowHtml(r, showTimer){
    var head = showTimer===false
      ? '<div class="rechead">'+(r.kind==='photo'?'Photo taken':'Times changed')+'</div>'
      : '<div class="rechead">'+(r.kind==='photo'?'Photo taken':r.timer)+'</div>';
    var body='';
    if(r.kind==='photo'){
      body=(showTimer===false?'':'<div class="recline">'+r.timer+'</div>')+
        (r.shows ? '<div class="recline '+driftClass(r.driftMin)+'">Timer read <b>'+esc(r.shows)+
          '</b>, phone <b>'+esc(r.clock||'')+'</b> — '+esc(driftWord(r.driftMin))+'</div>' : '')+
        photoThumbHtml(r);
    } else if((r.beforeList && r.afterList) || (r.before && r.after)){
      var bl = r.beforeList || parseSchText(r.before);
      var al = r.afterList  || parseSchText(r.after);
      r = Object.assign({}, r, {beforeList:bl, afterList:al});
      var n=Math.max(r.beforeList.length, r.afterList.length);
      for(var j=0;j<n;j++){
        var b=r.beforeList[j], a=r.afterList[j];
        if(b && a && b.time===a.time && b.days===a.days){
          body+='<div class="recrow same"><span class="recday">'+a.days+'</span>'+
                '<span class="rectime">'+a.time+'</span><span class="recnote">unchanged</span></div>';
        } else if(b && a){
          body+='<div class="recrow"><span class="recday">'+a.days+'</span>'+
                '<span class="rectime old">'+b.time+'</span>'+
                '<span class="recarrow">→</span>'+
                '<span class="rectime new">'+a.time+'</span></div>';
        } else if(a){
          body+='<div class="recrow"><span class="recday">'+a.days+'</span>'+
                '<span class="rectime new">'+a.time+'</span><span class="recnote">added</span></div>';
        } else {
          body+='<div class="recrow"><span class="recday">'+b.days+'</span>'+
                '<span class="rectime old">'+b.time+'</span><span class="recnote">removed</span></div>';
        }
      }
    } else {
      body='<div class="recline">'+r.before+' → '+r.after+'</div>';
    }
    return '<div class="logrow">'+head+body+
      (r.reason?'<div class="recwhy">'+r.reason+'</div>':'')+
      '<div class="logmeta">'+(r.who||'—')+' · '+stamp(r.at)+
      (r.id?'<button type="button" class="rm-link" data-rmrec="'+esc(r.id)+'">remove</button>':'')+
      '</div></div>';
}

      '<span class="mini">all '+all.length+' shown</span></div>';

      histShown=HIST_STEP; drawHistory();

}

var SET_COLL='timer_settings', LOG_COLL='timer_changes';
var CLOUD=null, CLOUD_OK=false, HAS_SET=false, unsubSet=null, unsubLog=null;

var CLOUD_ERR='';
function cloudInit(){
  try{
    if(typeof firebase==='undefined'){
      CLOUD_ERR='The Firebase library did not load — this page is saving on this device only.';
      return;
    }
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    CLOUD=firebase.firestore();
  }catch(e){ CLOUD=null; CLOUD_ERR='Could not start Firebase: '+(e&&e.message||'unknown error'); }
}

function cloudWatch(id){
  if(!CLOUD) return;
  if(unsubSet){ unsubSet(); unsubSet=null; }
  if(unsubLog){ unsubLog(); unsubLog=null; }

  unsubSet = CLOUD.collection(SET_COLL).doc(id).onSnapshot(function(doc){
    CLOUD_OK=true;
    var d = doc.exists ? doc.data() : null;
    HAS_SET = !!(d && d.timers && d.timers.length);
    if(d && d.timers && d.timers.length){
      d.timers.forEach(function(ct, ti){
        if(S.timers[ti] && ct && ct.sch)
          S.timers[ti].sch = ct.sch.map(function(w){
            return {on:w.on, off:w.off, days:(w.days&&w.days.length?w.days.slice():null)}; });
      });
      S.timers.forEach(function(t,ti){ if(!EDIT[ti]) drawSchedules(ti); });
      render();
    }
    syncNote();
  }, function(){ CLOUD_OK=false; syncNote(); });

  unsubLog = CLOUD.collection(LOG_COLL).orderBy('at','desc').limit(400)
    .onSnapshot(function(snap){
      CLOUD_OK=true;
      /* keep the document id: without it a record can never be taken back out */
      LOG = snap.docs.map(function(d){
        var r=d.data(); r.id=d.id; return r;
      });
      try{ localStorage.setItem('timerLog', JSON.stringify(LOG.slice(0,100))); }catch(e){}
      drawHistory(); drawChecks(); syncNote();
    }, function(){ CLOUD_OK=false; syncNote(); });
}

function saveOvr(){                       /* called after a saved change */
  var payload = S.timers.map(function(t){
    return {sch: t.sch.map(function(w){
      return {on:w.on, off:w.off, days:(w.days?w.days.slice():null)}; })};
  });
  if(CLOUD){
    CLOUD.collection(SET_COLL).doc(S.site).set({
      site:S.site, name:SITES[S.site].name, timers:payload,
      updatedAt:new Date().toISOString(), updatedBy:(WHO||'')
    }).catch(function(){ CLOUD_OK=false; syncNote(); });
  }
  var all=readOvr(); all[S.site]=S.timers.map(function(t){ return t.sch; });
  try{ localStorage.setItem('timerOvr', JSON.stringify(all)); }catch(e){}
  syncNote();
}
function readOvr(){ try{ return JSON.parse(localStorage.getItem('timerOvr')||'{}'); }catch(e){ return {}; } }
function clearOvr(){
  var all=readOvr(); delete all[S.site];
  try{ localStorage.setItem('timerOvr', JSON.stringify(all)); }catch(e){}
  if(CLOUD) CLOUD.collection(SET_COLL).doc(S.site).delete().catch(function(){});
  loadSite(S.site); render();
}

function syncNote(){
  var el=document.getElementById('ovrNote'); if(!el) return;
  if(CLOUD_OK){
    el.innerHTML='Shared with the team — changes show on every phone.'+
      (HAS_SET ? ' <button class="del" id="ovrReset">Reset to the built-in times</button>' : '');
    var b=document.getElementById('ovrReset');
    if(b) b.onclick=function(){
      if(b.dataset.sure){
        var beforeList=[];
        S.timers.forEach(function(t){ beforeList=beforeList.concat(schList(t.sch)); });
        var afterList=[];
        SITES[S.site].timers.forEach(function(t){ afterList=afterList.concat(schList(t.sch)); });
        addRecord({kind:'change', timer:'All timers — reset',
                   before:fmtSchAll(S.timers), after:fmtSchAll(SITES[S.site].timers),
                   beforeList:beforeList, afterList:afterList,
                   who:(WHO||'—'), reason:'Reset to the built-in times'});
        clearOvr();
      } else {
        b.dataset.sure='1'; b.textContent='Tap again to reset';
        setTimeout(function(){ if(b.parentNode){ b.removeAttribute('data-sure');
          b.textContent='Reset to the built-in times'; } }, 5000);
      }
    };
    el.style.display='';
  } else if(CLOUD_ERR){
    el.innerHTML=CLOUD_ERR;
    el.style.display='';
  } else if(readOvr()[S.site]){
    el.innerHTML='Not connected — this change is on this phone only and has not '+
      'reached the team yet. It will go up when the page next connects.';
    el.style.display='';
  } else { el.style.display='none'; }
}

/* One bar per row this timer drives, for the day on screen — so a duty/standby
   pair shows the handover rather than one ambiguous stripe. */
function drawTimeline(i, m, d){
  var t=S.timers[i], el=document.getElementById('tl'+i), h='';
  if(!el) return;
  var mine=S.pumps.filter(function(p){ return p.t===i; });
  if(!mine.length) mine=[{label:null, t:i, invert:false}];
  mine.forEach(function(p){
    var bars='', x=0;
    while(x<1440){
      var on = p.invert ? !timerOn(t,x,d) : timerOn(t,x,d);
      if(!on){ x++; continue; }
      var st=x;
      while(x<1440 && (p.invert ? !timerOn(t,x,d) : timerOn(t,x,d))) x++;
      bars+='<span style="left:'+(st/1440*100)+'%;width:'+((x-st)/1440*100)+'%"></span>';
    }
    if(mine.length>1 && p.label) h+='<div class="tlname">'+p.label+(p.invert?' <span class="dw">(runs while the contact is off)</span>':'')+'</div>';
    h+='<div class="tl">'+bars+'<b style="left:'+(m/1440*100)+'%"></b></div>';
  });
  el.innerHTML=h;
}

function setLamp(id, cls){ var e=document.getElementById(id); e.className='lamp '+cls; }

/* --- Hager EH011 dial: scale ring seen through the window --- */
function drawDial(i, m, day){
  var p=S.timers[i], R=175, CY=196, g='', k, a, b;
  if(day===undefined) day=nowDay();
  function proj(t){
    var d=((t-m+720+2880)%1440)-720, th=d/1440*2*Math.PI;
    return {y:CY+R*Math.sin(th), c:Math.cos(th), bow:(1-Math.cos(th))*7,
            vis:Math.abs(d)<350};
  }
  /* the tappet drum, seen edge-on */
  g+='<rect x="86" y="26" width="28" height="196" fill="#8f938e"/>';
  for(k=0;k<96;k++){                                   /* tappets: pushed left = ON */
    a=proj(k*15); b=proj(k*15+15);
    if(!a.vis&&!b.vis) continue;
    var y1=Math.min(a.y,b.y), h=Math.abs(b.y-a.y);
    if(h<0.5) continue;
    var on=timerOn(p, k*15+7, day), c=(a.c+b.c)/2, bw=(a.bow+b.bow)/2;
    var x = (on?87:101) + bw*0.35;
    g+='<rect x="'+x.toFixed(1)+'" y="'+(y1+0.35).toFixed(1)+'" width="12" height="'+
       Math.max(h-0.7,0.6).toFixed(1)+'" rx=".8" fill="'+(on?'#33618a':'#41454a')+
       '" stroke="'+(on?'#23486a':'#2b2f33')+'" stroke-width=".5" opacity="'+
       (0.5+0.5*c).toFixed(2)+'"/>';
  }
  for(k=0;k<96;k++){                                   /* 15-min ticks, bowed like the ring */
    var q=proj(k*15); if(!q.vis) continue;
    var hr=(k%4===0), len=hr?12:7, x0=83-len-q.bow;
    g+='<rect x="'+x0.toFixed(1)+'" y="'+(q.y-0.4).toFixed(1)+'" width="'+len+'" height="'+(hr?1.3:0.9)+
       '" fill="#3c3f42" opacity="'+(0.3+0.7*q.c).toFixed(2)+'"/>';
  }
  for(k=0;k<24;k++){                                   /* hour numbers, squashed by the curve */
    var n=proj(k*60); if(!n.vis || n.c<0.1) continue;
    g+='<g transform="translate('+(70-n.bow).toFixed(1)+','+n.y.toFixed(1)+') scale(1,'+
       n.c.toFixed(3)+')"><text x="0" y="4.4" text-anchor="end" font-family="Arial" '+
       'font-weight="bold" font-size="13" fill="#24272a" opacity="'+
       (0.4+0.6*n.c).toFixed(2)+'">'+k+'</text></g>';
  }
  document.getElementById('dial'+i).innerHTML=g;
  document.getElementById('dn'+i).textContent=fmt(m);
  document.getElementById('ts'+i).setAttribute('transform',
    p.tsw==='on' ? 'translate(0,26)' : 'translate(0,0)');
}

function render(){
  var m=nowMin(), d=nowDay(), r=runState(m,d);
  drawEmbed();
  document.getElementById('clockTxt').textContent=fmt(m);
  var cd=document.getElementById('clockDay'); if(cd) cd.textContent=DAYS[d];

  S.pumps.forEach(function(p,i){
    var run=r.run[i];
    if(p.row==='heater'){
      setLamp('run'+i, run?'on-white':'off-white');
      setLamp('stp'+i, run?'off-red':'on-red');
    } else if(p.row==='onlamp'){
      setLamp('run'+i, run?'on-teal':'off-teal');
    } else if(p.row==='simple'){
      setLamp('run'+i, run?'on-green':'off-green');
      setLamp('stp'+i, run?'off-red':'on-red');
    } else {
      setLamp('run'+i, run?'on-teal':'off-teal');
      setLamp('stp'+i, run?'off-red':'on-red');
      setLamp('trp'+i, p.tripped?'on-amber':'off-amber');
    }
    document.getElementById('k'+i+'tag').textContent=p.sel;
    document.querySelector('[data-knob="'+i+'"] i').style.transform='rotate('+ANG[p.sel]+'deg)';
  });

  S.timers.forEach(function(t,i){
    if(t.noTimer) return;          /* note card only: no dial, no timeline, no state line */
    drawTimeline(i,m,d);
    if(t.device==='digital') drawDigital(i,m,d);
    else if(t.device==='theben') drawTheben(i,m);
    else if(t.device==='round') drawRound(i,m);
    else drawDial(i,m,d);
    document.getElementById('dn'+i).textContent=fmt(m)+(t.device==='digital'?' · '+DAYSH[d]:'');

    /* what this timer is doing to its rows right now */
    var mine=S.pumps.map(function(p,pi){ return {p:p,i:pi}; }).filter(function(x){ return x.p.t===i; });
    var dr=document.getElementById('dr'+i);
    if(dr) dr.innerHTML = mine.map(function(x){
      return '<div>'+x.p.label+' — <b>'+(r.run[x.i]?'running':'stopped')+'</b>'+
             (x.p.invert?' <span class="dw">standby</span>':'')+'</div>';
    }).join('');

    var closed=contact(t,m,d), st;
    if(t.tsw==='on'){
      st='Held <b>ON</b> by hand — the programme is ignored until it is put back to auto.';
    } else {
      st = closed ? 'In timer period — <b>contact closed</b>.' : 'Outside timer period — <b>contact open</b>.';
      var nx=nextChange(t,m,d);
      if(nx) st+=' Next change at <b>'+fmt(nx.m)+'</b>'+(nx.sameDay?'':' ('+DAYS[nx.d]+')')+'.';
      st+=' Closed <b>'+dailyHours(t,d)+' h</b> today.';
    }
    var odd=mine.filter(function(x){ return x.p.tripped || x.p.sel!=='AUTO'; });
    if(odd.length) st+='<br><span class="warn">'+odd.map(function(x){
      return x.p.label+(x.p.tripped?' is tripped':' selector is at '+x.p.sel);
    }).join('; ')+' — the timer cannot reach it.</span>';
    if(!r.flow && mine.some(function(x){ return x.p.needsFlow; }))
      st+='<br><span class="warn">No circulation pump is running, so this stays off whatever the timer says.</span>';
    document.getElementById('st'+i).innerHTML=st;
    if(t.load==='banner') drawBanner(i, closed);
    if(t.load==='vsd') drawVsd(i, closed, t.hz||'30.0');
  });

  S.pumps.forEach(function(p,i){
    if(!p.extra) return;
    var circ = S.pumps.some(function(q,qi){
      return q.row!=='simple' && q.row!=='heater' && running(q, m); });
    setLamp('xlamp'+i, circ?'on-teal':'off-teal');
  });

  if(SITES[S.site].board) drawBoard();

  for(var k=0;k<S.heatCount;k++){
    var hpOn = (S.heat[k]==='ON' && r.flow);
    setLamp('hplamp'+k, hpOn?(S.heatStyle==='runstop'?'on-teal':'on-green')
                            :(S.heatStyle==='runstop'?'off-teal':'off-green'));
    if(S.heatStyle==='runstop') setLamp('hpstop'+k, hpOn?'off-red':'on-red');
    document.getElementById('kh'+k+'tag').textContent=S.heat[k];
    document.querySelector('[data-knob="heat'+k+'"] i').style.transform='rotate('+ANG[S.heat[k]]+'deg)';
  }
}

function nextChange(p,m,d){
  var cur=timerOn(p,m,d);
  for(var k=1;k<=1440*7;k++){
    var tot=m+k, mm=tot%1440, dd=(d+Math.floor(tot/1440))%7;
    if(timerOn(p,mm,dd)!==cur) return {m:mm, d:dd, sameDay:Math.floor(tot/1440)===0};
  }
  return null;
}
function dailyHours(p,d){
  var mins=0;
  for(var t=0;t<1440;t++) if(timerOn(p,t,d)) mins++;
  return (mins/60).toFixed(1);
}

/* What the technician needs at the door: the time the units should read, and
   which motors should be turning right now. */
var EMBED_NONE=false;
function drawEmbed(){
  if(!EMBED || EMBED_NONE) return;
  var box=document.getElementById('embedSummary'); if(!box) return;
  var m=nowMin(), d=nowDay(), r=runState(m,d);
  var c=document.getElementById('embClock'), dy=document.getElementById('embDay');
  if(c) c.textContent=fmt(m);
  if(dy) dy.textContent='· '+DAYS[d]+' · every timer here should read this';

  var rows=S.pumps.map(function(p,i){
    var t=S.timers[p.t], run=r.run[i], bits=[];
    if(t && !t.noTimer){
      (t.sch||[]).forEach(function(w){
        if(w.days && w.days.indexOf(d)<0) return;
        bits.push(w.on+'–'+w.off);
      });
    }
    var nx = (t && !t.noTimer) ? nextChange(t,m,d) : null;
    var why = p.noTimer ? 'no timer — kept off at the selector'
            : (bits.length? 'on today '+bits.join(', ') : 'no period set for today');
    if(p.invert) why += ' · runs while the contact is open';
    if(p.needsFlow && !r.flow) why += ' · no circulation, so it cannot run';
    return '<div class="emb-row"><span class="emb-name">'+esc(p.label)+'</span>'+
      '<span class="emb-state '+(run?'emb-run':'emb-stop')+'">'+(run?'should be RUNNING':'should be STOPPED')+'</span>'+
      '<span class="emb-when">'+esc(why)+
      (nx && !p.noTimer ? ' · next change '+fmt(nx.m)+(nx.sameDay?'':' ('+DAYS[nx.d]+')') : '')+
      '</span></div>';
  }).join('');
  for(var k=0;k<S.heatCount;k++){
    rows+='<div class="emb-row"><span class="emb-name">Heat pump'+(S.heatCount>1?' '+(k+1):'')+'</span>'+
      '<span class="emb-state '+(r.flow?'emb-run':'emb-stop')+'">'+
      (r.flow?'may run':'cannot run')+'</span>'+
      '<span class="emb-when">follows its OFF-ON switch, and only with a circulation pump running</span></div>';
  }
  box.innerHTML='<h2>What should be happening now</h2>'+rows+
    '<p class="emb-foot">Compare this with the real door. If a lamp disagrees, or a timer reads a '+
    'different time, note it down. <a href="'+location.pathname+'?site='+encodeURIComponent(S.site)+
    '" target="_blank" rel="noopener">Open the full timer page</a> to record the weekly check or edit times.</p>';
  box.hidden=false;
}

function buildHowTo(){

  var anyDigital=S.timers.some(function(t){ return t.device==='digital'; });
  var h='<b>AUTO</b> — the pump follows its timer periods. <b>MAN</b> — runs continuously, '+
        'START/STOP take over. <b>OFF</b> — dead, STOP lamp lit.<br>'+
        'RUN lamp lit while running, red STOP lamp lit while stopped. A heat pump only runs when '+
        'at least one circulation pump is running (no flow, no heating).<br>'+
        'Tap a <b>TRIP</b> lamp to simulate an overload trip — the pump drops out until you tap it again to reset.';
  if(swap) h+='<br><br><b>One timer, two pumps.</b> The changeover timer runs the duty pump while its '+
      'contact is closed and the standby pump while it is open, so one pump is always circulating and '+

      '<i>other</i> one is running before calling it a fault.';
  h+='<br><br><b>The unit beside each timer</b> is what the real one in the plant room should look like now. '+

                 : ': the hour against the ▶ pointer should match, and the blue tappets should be pushed '+
                   'in over the same hours.')+
     ' If the real one is out, the pool is running to the wrong clock — correct it and note it down below.';

/* ---- events ---- */
document.addEventListener('click', function(e){
  var rm=e.target.closest('[data-rmrec]');
  if(rm){ removeRecord(rm.dataset.rmrec); return; }
  if(e.target.closest('#histToggle')){ HIST_OPEN=!HIST_OPEN; drawHistory(); return; }
  var tr=e.target.closest('[data-trec]');
  if(tr){
    var lbl=S.timers[+tr.dataset.trec].label;
    TREC_OPEN[lbl]=!TREC_OPEN[lbl];
    drawTimerRecords(); return;
  }
  var pv=e.target.closest('[data-photoview]');
  if(pv){ openPhoto(pv.dataset.photoview, pv.dataset.photocap||''); return; }
  var lb=document.getElementById('lightbox');
  if(lb && lb.style.display==='flex' &&
     (e.target===lb || e.target.closest('.lb-close'))){ lb.style.display='none'; return; }
  var ts=e.target.closest('[data-tsw]');
  if(ts){ var ti=+ts.dataset.tsw;
    S.timers[ti].tsw = (S.timers[ti].tsw==='on') ? 'auto' : 'on';
    save(); render(); return; }
  var k=e.target.closest('[data-knob]');
  if(k){
    if(k.dataset.knob.indexOf('heat')===0){
      var hk=+k.dataset.knob.slice(4);
      S.heat[hk] = S.heat[hk]==='ON'?'OFF':'ON';
    } else {
      var order=['MAN','OFF','AUTO'], p=S.pumps[+k.dataset.knob];
      p.sel=order[(order.indexOf(p.sel)+1)%3];
    }
    save(); render(); return;
  }
  var ed=e.target.closest('[data-edit]');
  if(ed){ var ei=+ed.dataset.edit;
    EDIT[ei]=true; BEFORE[ei]=fmtSch(S.timers[ei].sch);
    BEFORE['raw'+ei]=S.timers[ei].sch.map(function(w){
      return {on:w.on, off:w.off, days:(w.days?w.days.slice():null)}; });
    drawSchedules(ei); return; }

  var ce=e.target.closest('[data-canceledit]');
  if(ce){ var ci=+ce.dataset.canceledit;
    S.timers[ci].sch=BEFORE['raw'+ci].map(function(w){
      return {on:w.on, off:w.off, days:(w.days?w.days.slice():null)}; });
    EDIT[ci]=false; drawSchedules(ci); render(); return; }

  var dy=e.target.closest('[data-day]');
  if(dy){
    var q=dy.dataset.day.split('-'), ti=+q[0], pj=+q[1], w=S.timers[ti].sch[pj];
    if(q[2]==='all'){ w.days=null; }
    else{
      var d=+q[2];
      var cur = w.days ? w.days.slice() : [0,1,2,3,4,5,6];
      var at=cur.indexOf(d);
      if(at>=0){ if(cur.length===1) return; cur.splice(at,1); }
      else cur.push(d);
      cur.sort();
      w.days = (cur.length===7) ? null : cur;
    }
    drawSchedules(ti); render(); return;
  }

  var se=e.target.closest('[data-savedit]');
  if(se){ var si=+se.dataset.savedit;
    var who=(document.getElementById('who'+si).value||'').trim();
    var why=(document.getElementById('why'+si).value||'').trim();
    var err=document.getElementById('err'+si);
    if(!who){ err.textContent='Put your name in.'; return; }
    if(!why){ err.textContent='Say why it was changed.'; return; }
    var after=fmtSch(S.timers[si].sch);
    if(after===BEFORE[si]){ EDIT[si]=false; drawSchedules(si); render(); return; }
    WHO=who; try{ localStorage.setItem('timerWho', who); }catch(e2){}
    saveOvr();
    addRecord({kind:'change', timer:S.timers[si].label, before:BEFORE[si], after:after,
               beforeList:schList(BEFORE['raw'+si]), afterList:schList(S.timers[si].sch),
               who:who, reason:why});
    EDIT[si]=false; drawSchedules(si); render(); return; }

  var d=e.target.closest('[data-del]');
  if(d){
    var dp=d.dataset.del.split('-');
    S.timers[+dp[0]].sch.splice(+dp[1],1);
    drawSchedules(+dp[0]); render(); return;
  }
  var ad=e.target.closest('[data-add]');
  if(ad){
    var ai=+ad.dataset.add;
    S.timers[ai].sch.push({on:'00:00',off:'06:00',days:null});
    drawSchedules(ai); render(); return;
  }
  var b=e.target.closest('[data-press]');
  if(b){
    var a=b.dataset.press;
    if(a.indexOf('start')===0){ var i=+a.slice(5); S.pumps[i].manRun=true; }
    if(a.indexOf('stop')===0){ var i2=+a.slice(4); S.pumps[i2].manRun=false; }
    if(a.indexOf('trip')===0){ var i3=+a.slice(4); S.pumps[i3].tripped=!S.pumps[i3].tripped; }
    save(); render(); return;
  }
});

/* Say what the gap is the moment it is typed, before the photo is even taken. */
document.addEventListener('input', function(e){
  var t=e.target;
  if(t && /^pshow\d+$/.test(t.id||'')){
    var i=t.id.slice(5), out=document.getElementById('pdrift'+i);
    if(!out) return;
    var d=driftMinutes((t.value||'').trim(), new Date());
    out.className='mini '+driftClass(d);
    out.textContent = d===null ? '' :
      (Math.abs(d)<=2 ? '✓ matches the phone ('+fmt(nowMin())+')'
                      : driftWord(d)+' — the pump hours have shifted with it');
  }
});

document.addEventListener('change', function(e){
  var t=e.target;
  if(t.dataset && t.dataset.photo!==undefined && t.files && t.files[0]){
    sendPhoto(+t.dataset.photo, t.files[0]); t.value=''; return;
  }
  if(t.dataset && t.dataset.p!==undefined && t.type==='time'){
    S.timers[+t.dataset.p].sch[+t.dataset.j][t.dataset.f]=t.value||'00:00';
    render();
  }
});

document.getElementById('mLive').onclick=function(){
  S.mode='live'; this.classList.add('sel');
  document.getElementById('mManual').classList.remove('sel');
  document.getElementById('scrubWrap').style.display='none'; render();
};
document.getElementById('mManual').onclick=function(){
  S.mode='manual'; this.classList.add('sel');
  document.getElementById('mLive').classList.remove('sel');
  document.getElementById('scrubWrap').style.display='block';
  document.getElementById('scrub').value=S.manual;
  document.getElementById('dayPick').value=String(S.day);
  render();
};
document.getElementById('scrub').oninput=function(){ S.manual=+this.value; render(); };
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ var lb=document.getElementById('lightbox'); if(lb) lb.style.display='none'; }
  /* the camera is a label, so give it the keyboard behaviour of a button */
  if((e.key==='Enter'||e.key===' ') && e.target && e.target.classList &&
     e.target.classList.contains('photobtn')){ e.preventDefault(); e.target.click(); }
});
(function(){
  var dp=document.getElementById('dayPick'), h='';
  for(var i=1;i<=7;i++){ var d=i%7; h+='<option value="'+d+'">'+DAYS[d]+'</option>'; }
  dp.innerHTML=h; dp.value=String(S.day);
  dp.onchange=function(){ S.day=+this.value; render(); };
})();

cloudInit();
var last=null; try{ last=localStorage.getItem('timerSite'); }catch(e){}
loadSite(SITES[last]?last:'JEIP1');

(function(){
  var sel=document.getElementById('site'), h='';
  var keys=ORDER.filter(function(k){ return SITES[k]; })
    .concat(Object.keys(SITES).filter(function(k){ return ORDER.indexOf(k)<0; }));
  keys.forEach(function(k){
    h+='<option value="'+k+'"'+(k===S.site?' selected':'')+'>'+SITES[k].name+'</option>';
  });
  PENDING.forEach(function(n){
    h+='<option value="pending:'+n+'">'+n+' — not set up yet</option>';
  });
  sel.innerHTML=h;
  sel.onchange=function(){
    if(this.value.indexOf('pending:')===0){
      var nm=this.value.slice(8), pn=document.getElementById('pendNote');
      pn.innerHTML='<b>'+nm+'</b> has not been set up yet — its timer settings still need to be added.';
      pn.style.display='';
      this.value=S.site;
      return;
    }
    document.getElementById('pendNote').style.display='none';
    loadSite(this.value); render();
  };
  document.getElementById('siteNote').textContent='Timer settings for this pool';
  document.getElementById('copyHist').onclick=function(){
    var rows=LOG.filter(function(r){ return r.site===S.site; });
    if(!rows.length) return;
    var txt='Timer record — '+SITES[S.site].name+'\n'+rows.map(function(r){
      return stamp(r.at)+' · '+(r.kind==='photo'?'Photo · '+r.timer+(r.link?' · '+r.link:'')
        : r.timer+' '+r.before+' → '+r.after)+(r.reason?' · '+r.reason:'')+' · '+(r.who||'—');
    }).join('\n');
    var m=document.getElementById('copyMsg');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ m.textContent='Copied.'; });
    } else { m.textContent='Long-press to select instead.'; }
    setTimeout(function(){ m.textContent=''; }, 4000);
  };
})();

if(EMBED) startEmbed();
else if(Q.site && SITES[Q.site]){ loadSite(Q.site); }   /* a direct link to one panel */

render();
setInterval(function(){ if(S.mode==='live') render(); }, 5000);


</script>

  <p class="lb-hint" style="display:none">This photo could not be shown here.
    <a class="lb-open" href="#" target="_blank" rel="noopener">Open it in Drive</a></p>
  <p class="lb-cap"></p>
</div>
